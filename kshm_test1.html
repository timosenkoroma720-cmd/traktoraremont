<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КШМ — Тест 1 (Базовый)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; margin: 0; padding: 20px; }
        .quiz-card { max-width: 850px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .timer-sticky { position: sticky; top: 10px; background: #e74c3c; color: white; padding: 12px 20px; border-radius: 8px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 4px 10px rgba(231,76,60,0.3); }
        .question-block { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 5px solid #3498db; padding: 15px 20px; margin-bottom: 20px; border-radius: 6px; }
        .question-title { font-weight: 600; font-size: 16px; margin-bottom: 12px; }
        .option { display: block; margin: 8px 0; padding: 8px 12px; border-radius: 4px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; transition: background 0.2s; }
        .option:hover { background: #f1f5f9; }
        .option input { margin-right: 10px; }
        .btn-submit { display: block; width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #219150; }
        .result-box { margin-top: 25px; padding: 20px; border-radius: 8px; display: none; }
        .explanation { margin-top: 10px; padding: 10px; background: #e2e8f0; border-radius: 4px; font-size: 14px; color: #334155; display: none; }
        .failed { background: #fee2e2; border: 1px solid #f87171; color: #991b1b; }
        .passed { background: #dcfce7; border: 1px solid #4ade80; color: #166534; }

        /* Окно ввода ФИО */
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .auth-modal { background: white; padding: 30px; border-radius: 10px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .auth-modal input { width: 100%; padding: 12px; margin: 15px 0; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        .auth-modal button { padding: 12px 24px; background: #3498db; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .auth-modal button:hover { background: #2980b9; }
    </style>
</head>
<body>

<!-- Модальное окно авторизации -->
<div id="authModal" class="auth-overlay">
    <div class="auth-modal">
        <h3>Регистрация перед тестом</h3>
        <p>Введите ваши Фамилию, Имя и Отчество:</p>
        <input type="text" id="studentNameInput" placeholder="ФИО ученика..." required>
        <button type="button" onclick="startQuiz()">Начать тест</button>
    </div>
</div>

<div class="quiz-card">
    <div class="header">
        <h2>Кривошипно-шатунный механизм — Тест 1</h2>
        <p>Уровень: Базовый (Назначение, общее устройство и детали)</p>
    </div>

    <div class="timer-sticky">
        <span>⏱️ Оставшееся время:</span>
        <span id="timer">10:00</span>
    </div>

    <form id="quizForm" style="margin-top: 20px;">
        <div id="questionsContainer"></div>
        <button type="button" class="btn-submit" onclick="finishQuiz(false)">Завершить тест</button>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
const TEST_TITLE = "КШМ: Тест 1 (Базовый)";
let studentName = "";

const quizData = [
    { q: "1. Каково основное назначение кривошипно-шатунного механизма (КШМ)?", options: ["Для передачи вращения на передний мост", "Для преобразования возвратно-поступательного движения поршня во вращательное движение коленчатого вала", "Для открытия и закрытия клапанов", "Для подачи топлива в цилиндры"], correct: 1, exp: "КШМ воспринимает давление газов и преобразует прямолинейное возвратно-поступательное движение поршня во вращение коленчатого вала." },
    { q: "2. На какие две группы подразделяются детали КШМ?", options: ["Основная и вспомогательная", "Подвижные и неподвижные", "Чугунные и стальные", "Верхняя и нижняя"], correct: 1, exp: "Детали КШМ разделяют на неподвижные (блок цилиндров, ГБЦ, поддон) и подвижные (поршень, шатун, коленчатый вал, маховик)." },
    { q: "3. Какая из перечисленных деталей относится к неподвижным деталям КШМ?", options: ["Поршень", "Шатун", "Блок цилиндров", "Коленчатый вал"], correct: 2, exp: "Блок цилиндров является базовой неподвижной деталью двигателя." },
    { q: "4. Какая из перечисленных деталей относится к подвижной группе КШМ?", options: ["Головка блока цилиндров", "Шатун", "Картер двигателя", "Поддон картера"], correct: 1, exp: "Шатун — это подвижная деталь, соединяющая поршень с коленчатым валом." },
    { q: "5. Какую функцию выполняет поршень в цилиндре дизеля?", options: ["Воспринимает давление расширяющихся газов при сгорании топлива", "Охлаждает масло в картере", "Подает воздух в цилиндр", "Регулирует угол опережения впрыска"], correct: 0, exp: "Поршень воспринимает давление газов при такте расширения (рабочего хода) и передает его через шатун на коленвал." },
    { q: "6. Из какого материала чаще всего изготавливают поршни современных тракторных дизелей?", options: ["Из серого чугуна", "Из алюминиевых сплавов", "Из бронзы", "Из кованой меди"], correct: 1, exp: "Алюминиевые сплавы обладают малой массой и высокой теплопроводностью, что снижает инерционные нагрузки." },
    { q: "7. Назначение компрессионных поршневых колец состоит в:", options: ["Удалении излишков масла со стенок цилиндра", "Обеспечении герметичности камеры сгорания (предотвращении прорыва газов)", "Фиксации поршневого пальца", "Центрировании маховика"], correct: 1, exp: "Компрессионные кольца уплотняют зазор между поршнем и стенкой цилиндра." },
    { q: "8. Назначение маслосъемных колец заключается в:", options: ["Уплотнении камеры сгорания", "Снятии излишков масла со стенок гильзы цилиндра", "Охлаждении днища поршня", "Передаче усилия на шатун"], correct: 1, exp: "Маслосъемное кольцо снимает излишки масла, предотвращая его попадание и сгорание в камере сгорания." },
    { q: "9. Как называется верхняя часть поршня, воспринимающая давление газов?", options: ["Юбка", "Днище", "Бобышка", "Пояс"], correct: 1, exp: "Верхняя часть поршня называется днищем." },
    { q: "10. Какая часть поршня направляет его движение в цилиндре?", options: ["Днище", "Юбка (направляющая часть)", "Канавка", "Замковый стык"], correct: 1, exp: "Юбка поршня служит направляющей при его перемещении внутри гильзы цилиндра." },
    { q: "11. С помощью какой детали поршень соединяется с верхней головкой шатуна?", options: ["Поршневой палец", "Шатунный болт", "Шпонка", "Маховик"], correct: 0, exp: "Поршневой палец шарнирно связывает поршень с верхней головкой шатуна." },
    { q: "12. Какую форму имеет стержень шатуна в поперечном сечении?", options: ["Круглую", "Двутавровую (в виде буквы Н)", "Квадратную", "Треугольную"], correct: 1, exp: "Двутавровое сечение обеспечивает максимальную жесткость и прочность при минимальном весе." },
    { q: "13. Какая деталь КШМ преобразует возвратно-поступательное движение шатуна во вращательное?", options: ["Распределительный вал", "Маховик", "Коленчатый вал", "Блок цилиндров"], correct: 2, exp: "Коленчатый вал воспринимает усилие от шатунов и преобразует его во вращательный момент." },
    { q: "14. Как называются шейки коленчатого вала, с помощью которых он опирается на блок цилиндров?", options: ["Шатунные шейки", "Коренные шейки", "Щеки", "Противовесы"], correct: 1, exp: "Коренные шейки являются опорными и вращаются в подшипниках блока цилиндров." },
    { q: "15. К каким шейкам коленчатого вала присоединяются нижние головки шатунов?", options: ["К коренным", "К шатунным", "К носку вала", "К хвостовику"], correct: 1, exp: "Нижняя разъемная головка шатуна монтируется на шатунную шейку коленвала." },
    { q: "16. Для чего предназначены противовесы на коленчатом валу?", options: ["Для разбрызгивания масла", "Для уравновешивания сил инерции подвижных масс", "Для охлаждения вала", "Для крепления маховика"], correct: 1, exp: "Противовесы уменьшают центробежные силы инерции неуравновешенных масс и снижают вибрацию." },
    { q: "17. Для чего на заднем конце коленчатого вала устанавливается тяжелый диск — маховик?", options: ["Для красивого внешнего вида", "Для вывода поршней из мертвых точек и обеспечения равномерного вращения вала", "Для установки генератора", "Для защиты от пыли"], correct: 1, exp: "Маховик накапливает кинетическую энергию на рабочем ходу и отдает ее на подготовительных тактах." },
    { q: "18. В чем разница между МТ (мертвой точкой) ВМТ и НМТ?", options: ["ВМТ — крайнее верхнее положение поршня, НМТ — крайнее нижнее", "ВМТ — скорость 0, НМТ — максимальная скорость", "Это одно и то же", "ВМТ только у дизелей, НМТ у бензиновых ДВС"], correct: 0, exp: "ВМТ (верхняя мертвая точка) — крайнее верхнее положение поршня в цилиндре, НМТ — крайнее нижнее." },
    { q: "19. Что такое «ход поршня»?", options: ["Диаметр цилиндра", "Расстояние, проходимое поршнем от ВМТ до НМТ", "Объем цилиндра", "Длина шатуна"], correct: 1, exp: "Ход поршня (S) — это расстояние между ВМТ и НМТ, равное удвоенному радиусу кривошипа." },
    { q: "20. Какая деталь герметизирует стык между блоком цилиндров и головкой блока (ГБЦ)?", options: ["Сальник", "Прокладка ГБЦ", "Резиновое кольцо", "Медная шайба"], correct: 1, exp: "Прокладка ГБЦ обеспечивает герметичность стыка по газам, маслу и охлаждающей жидкости." }
];

let timeLeft = 600;
let timerInterval;

function startQuiz() {
    let input = document.getElementById("studentNameInput").value.trim();
    if (!input) {
        alert("Пожалуйста, введите свое ФИО!");
        return;
    }
    studentName = input;
    document.getElementById("authModal").style.display = "none";
    startTimer();
}

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        let min = Math.floor(timeLeft / 60);
        let sec = timeLeft % 60;
        document.getElementById('timer').innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            finishQuiz(true);
        }
    }, 1000);
}

function renderQuiz() {
    const container = document.getElementById('questionsContainer');
    quizData.forEach((item, index) => {
        let html = `<div class="question-block">
            <div class="question-title">${item.q}</div>`;
        item.options.forEach((opt, optIdx) => {
            html += `<label class="option">
                <input type="radio" name="q${index}" value="${optIdx}"> ${opt}
            </label>`;
        });
        html += `<div class="explanation" id="exp_${index}"><strong>Пояснение:</strong> ${item.exp}</div></div>`;
        container.innerHTML += html;
    });
}

function saveResultToAdmin(score, percent, markNum) {
    let logs = JSON.parse(localStorage.getItem("test_results_log") || "[]");
    let previousAttempts = logs.filter(item => item.userName === studentName && item.testTitle === TEST_TITLE).length;
    
    let now = new Date();
    let timeStr = now.toLocaleDateString('ru-RU') + " " + now.toLocaleTimeString('ru-RU').slice(0, 5);

    logs.push({
        userName: studentName,
        testTitle: TEST_TITLE,
        score: markNum,
        percent: percent,
        attempt: previousAttempts + 1,
        timestamp: timeStr
    });

    localStorage.setItem("test_results_log", JSON.stringify(logs));
}

function finishQuiz(isTimeout) {
    clearInterval(timerInterval);
    const inputs = document.querySelectorAll('input[type="radio"]');
    inputs.forEach(i => i.disabled = true);

    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';

    quizData.forEach((_, index) => {
        document.getElementById(`exp_${index}`).style.display = 'block';
    });

    if (isTimeout) {
        resultBox.className = 'result-box failed';
        resultBox.innerHTML = `
            <h2>❌ ТЕСТ НЕ ПРОЙДЕН</h2>
            <p>Ученик: <strong>${studentName}</strong></p>
            <p><strong>Причина:</strong> Время отведенное на тест (10 минут) истекло!</p>
            <p>Итоговая оценка: <strong>2 (Неудовлетворительно)</strong></p>
            <p>Ознакомьтесь с правильными ответами ниже.</p>
        `;
        saveResultToAdmin(0, 0, 2);
        return;
    }

    let score = 0;
    quizData.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if (selected && parseInt(selected.value) === item.correct) {
            score++;
        }
    });

    let percent = Math.round((score / quizData.length) * 100);
    let markText = "";
    let markNum = 2;
    let statusClass = "";

    if (score >= 18) { markText = "5 (Отлично)"; markNum = 10; statusClass = "passed"; }
    else if (score >= 15) { markText = "4 (Хорошо)"; markNum = 8; statusClass = "passed"; }
    else if (score >= 10) { markText = "3 (Удовлетворительно)"; markNum = 6; statusClass = "passed"; }
    else { markText = "2 (Неудовлетворительно)"; markNum = 2; statusClass = "failed"; }

    resultBox.className = `result-box ${statusClass}`;
    resultBox.innerHTML = `
        <h2>Результаты тестирования</h2>
        <p>Ученик: <strong>${studentName}</strong></p>
        <p>Правильных ответов: <strong>${score} из ${quizData.length} (${percent}%)</strong></p>
        <p>Итоговая оценка: <strong>${markText}</strong></p>
        <hr>
        <p>Ниже представлены правильные ответы и пояснения к каждому вопросу.</p>
    `;

    saveResultToAdmin(score, percent, markNum);
}

window.onload = function() {
    renderQuiz();
};
</script>
</body>
</html>
