<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест 3: Повышенный уровень — Система охлаждения двигателя</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #9b59b6; padding-bottom: 10px; }
        .timer { font-size: 20px; font-weight: bold; color: #e74c3c; background: #ffe6e6; padding: 5px 15px; border-radius: 5px; }
        .q-card { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background: #fafafa; }
        .q-title { font-weight: bold; margin-bottom: 10px; }
        .option { display: block; margin: 5px 0; cursor: pointer; }
        button { background-color: #9b59b6; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #8e44ad; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 5px; text-align: center; font-size: 20px; font-weight: bold; }
        .pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .timeout-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,0,0,0.9); justify-content: center; align-items: center; color: white; font-size: 36px; font-weight: bold; text-align: center; z-index: 1000; padding: 20px; box-sizing: border-box; }
        .explanation { margin-top: 8px; font-size: 14px; padding: 8px; border-radius: 4px; }
        .exp-correct { background-color: #d4edda; color: #155724; }
        .exp-incorrect { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div id="timeoutAlert" class="timeout-overlay">
    ТЕСТ НЕ ПРОЙДЕН, ОБРАТИТЕСЬ К УЧИТЕЛЮ
</div>

<div class="container">
    <div class="header">
        <h2>Тест 3: Повышенный уровень (Спецсистемы и диагностика)</h2>
        <div class="timer" id="timer">10:00</div>
    </div>
    <form id="quizForm" style="margin-top: 20px;">
        <div id="questionsContainer"></div>
        <button type="button" onclick="submitQuiz()">Завершить тест</button>
    </form>
    <div id="result" class="result-box" style="display:none;"></div>
</div>

<script>
const rawQuestions = [
    { q: "В чем принцип работы электронно-управляемого термостата (с электрическим нагревателем)?", options: ["ЭБУ подает напряжение на нагреватель, принудительно открывая клапан до наступления естественного нагрева ОЖ", "Термостат открывается от давления водяного насоса", "В нем используется биметаллическая пластина без воска", "Он управляется вакуумным сервоприводом"], correct: 0, exp: "Подгрев воскового элемента встроенным резистором позволяет превентивно понижать температуру двигателя под высокой нагрузкой." },
    { q: "Какое преимущество дает двухконтурная система охлаждения (отдельные контуры ГБЦ и блока)?", options: ["Разные температуры: ГБЦ охлаждается сильнее для детонационной стойкости, а блок поддерживается более горячим", "Возможность использовать два разных типа антифриза", "Полный отказ от вентилятора охлаждения", "Снижение массы двигателя на 30%"], correct: 0, exp: "Более горячий блок снижает трение в ЦПГ, а холодная ГБЦ предотвращает детонацию." },
    { q: "Для чего применяется система After-Run (прокачка ОЖ после заглушения двигателя)?", options: ["Для предотвращения локального закипания и закоксовывания масла в подшипниках турбокомпрессора", "Для быстрого прогрева салона зимой", "Для очистки радиатора от пыли", "Для проверки герметичности клапана"], correct: 0, exp: "После остановки горячего мотора тепловой удар может спечь масло в турбине, поэтому электропомпа продолжать циркуляцию." },
    { q: "Что такое интеркулер типа «воздух-жидкость» (жидкостный интеркулер)?", options: ["Охладитель наддувочного воздуха, где хладагентом выступает жидкость из специального низкотемпературного контура", "Радиатор для охлаждения тормозной жидкости", "Отопитель переднего бампера", "Контур охлаждения гидравлики"], correct: 0, exp: "Жидкостные интеркулеры компактнее и эффективнее за счет высокой теплоемкости воды/антифриза." },
    { q: "Как различаются гибридные карбоксилатные (G12/G12+) и силикатные (G11) антифризы по механизму защиты?", options: ["Карбоксилаты образуют защитную пленку только в местах возникновения коррозии, а силикаты покрывают все поверхности", "Силикаты закипают при 150°C, а карбоксилаты при 90°C", "Карбоксилатные антифризы разрушают алюминиевые блоки", "Они абсолютно одинаковы по химическому действию"], correct: 0, exp: "Локальное воздействие карбоксилатов (OAT) сохраняет высокий уровень теплоотдачи чистых стенок." },
    { q: "Что такое «тепловой удар» (Thermal Shock) двигателя при резком глушении под нагрузкой?", options: ["Резкий скачок температуры ОЖ в ГБЦ из-за остановки циркуляции при горячих деталях", "Замораживание антифриза в блоке", "Взрыв расширительного бачка", "Пробой изоляции свечей"], correct: 0, exp: "После остановки помпы тепло от поршней и ГБЦ устремляется в стоячую ОЖ, вызывая локальное кипение." },
    { q: "Каким прибором проверяют плотность и температуру замерзания антифриза?", options: ["Рефрактометром или ареометром", "Манометром", "Осциллографом", "Динамометрическим ключом"], correct: 0, exp: "Рефрактометр по преломлению света точно определяет концентрацию этиленгликоля." },
    { q: "Что такое кавитационная эрозия гильз цилиндров в мокрых гильзовых ДВС?", options: ["Разрушение внешних стенок гильз из-за микросхлопывания пузырей при вибрации гильзы", "Износ внутренней поверхности от поршневых колец", "Коррозия от выхлопных газов", "Отложение накипи на поршне"], correct: 0, exp: "Вибрации стенок гильзы вызывают кавитацию ОЖ, которая точечно разрушает чугун или алюминий." },
    { q: "Для чего в некоторых двигателях применяется двухступенчатый термостат?", options: ["Для плавного открытия большого круга и снижения гидроудара/термошока", "Для работы на двух видах топлива", "Для подключения масляного радиатора", "Для дублирования на случай поломки"], correct: 0, exp: "Малый клапан открывается первым, снижая давление на основной тарельчатый клапан." },
    { q: "Каким образом ЭБУ определяет эффективность работы системы охлаждения для OBD-II диагностики?", options: ["Сравнивает время прогрева по ДТОЖ с расчетной моделью и контролирует расхождение датчиков", "По звуку работы вентилятора", "По уровню жидкости в бачке через ультразвук", "По давлению в выхлопной трубе"], correct: 0, exp: "Если мотор прогревается дольше норматива (например, из-за открытого термостата), ЭБУ заносит ошибку P0128." },
    { q: "Что произойдет при ошибочном заливе чистого 100% концентрата этиленгликоля без воды?", options: ["Температура замерзания ухудшится (поднимется до -13°C), а теплоемкость снизится", "Жидкость не замерзнет даже при -100°C", "Двигатель станет холоднее на 30 градусов", "Разрушатся все резиновые патрубки за 5 минут"], correct: 0, exp: "Чистый этиленгликоль замерзает при -13°C; максимальная морозостойкость (-65°C) достигается в смеси с водой (65/35)." },
    { q: "Как влияет закрытие жалюзи радиатора (Active Grille Shutters) на экономичность авто?", options: ["Улучшает аэродинамику и ускоряет прогрев, снижая расход топлива", "Увеличивает мощность за счет наддува", "Снижает нагрузку на генератор", "Увеличивает износ шин"], correct: 0, exp: "Активные жалюзи уменьшают лобовое сопротивление воздуху, когда охлаждение радиатора не требуется." },
    { q: "В чем опасность использования водопроводной жесткой воды в системе охлаждения?", options: ["Выпадение солей жесткости (Ca, Mg) в виде накипи и ускоренная коррозия", "Замерзание при +10°C", "Мгновенное разбухание патрубков", "Образование горючих газов"], correct: 0, exp: "Соли Ca и Mg при нагреве выпадают в осадок, забивая тонкие трубки радиатора." },
    { q: "Какой сигнал генерирует датчик уровня ОЖ герконового типа?", options: ["Изменение замыкания контактов при перемещении поплавка с магнитом", "Изменение электрического сопротивления жидкости", "Ультразвуковой импульс", "Оптическое преломление света"], correct: 0, exp: "Поплавок с магнитом опускается вместе с уровнем, размыкая или замыкая геркон." },
    { q: "Что такое лобовое сопротивление радиатора охлаждения?", options: ["Сопротивление прохождению воздуха через соты и пластины радиатора", "Гидравлическое сопротивление внутри трубок", "Сопротивление ремня помпы", "Давление жидкости на клапан"], correct: 0, exp: "Плотное оребрение радиатора создает аэродинамическое сопротивление входящему потоку воздуха." },
    { q: "Зачем в систему охлаждения встраивается теплообменник (масляно-водяной радиатор)?", options: ["Для быстрого прогрева масла от ОЖ при пуске и его охлаждения при нагрузках", "Для смешивания масла и антифриза", "Для фильтрации масляных паров", "Для подогрева омывающей жидкости"], correct: 0, exp: "Водомасляный теплообменник выравнивает температуры масла и ОЖ." },
    { q: "Что может вызывать постоянное завоздушивание системы при исправной прокладке ГБЦ?", options: ["Микротрещина в стенке цилиндра или ГБЦ", "Неисправный генератор", "Использование синего антифриза", "Слишком широкий ремень помпы"], correct: 0, exp: "Микротрещины расширяются при нагреве, пропуская газы из камеры сгорания под высоким давлением." },
    { q: "Как влияет работа кондиционера на нагрузку системы охлаждения?", options: ["Увеличивает нагрузку, так как конденсатор кондиционера нагревает воздух перед радиатором ДВС", "Уменьшает нагрузку, так как кондиционер охлаждает весь автомобиль", "Не оказывает никакого влияния", "Отключает водяной насос"], correct: 0, exp: "Конденсатор кондиционера стоит перед радиатором двигателя и отдаёт ему дополнительное тепло." },
    { q: "Что представляет собой лопастной импеллер (крыльчатка) помпы с закрытым венцом?", options: ["Крыльчатка с дисками с обеих сторон лопастей, обладающая высоким КПД и меньшими перетечками", "Крыльчатка из мягкой резины", "Крыльчатка без лопастей", "Крыльчатка с приводом от турбины"], correct: 0, exp: "Закрытые крыльчатки обеспечивают лучший гидродинамический напор по сравнению с открытыми." },
    { q: "Какова функция анодной (жертвенной) защиты в некоторых системах охлаждения?", options: ["Коррозия более активного металла (цинком/магнием) для защиты стальных и алюминиевых деталей", "Повышение температуры кипения", "Удержание нагара", "Смазка сальника помпы"], correct: 0, exp: "Жертвенный анод разрушается первым, принимая на себя гальваническую коррозию." }
];

let shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let questions = shuffle([...rawQuestions]).map(q => {
    let opts = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.correct }));
    opts = shuffle(opts);
    return { ...q, options: opts };
});

function renderQuiz() {
    const container = document.getElementById("questionsContainer");
    questions.forEach((q, idx) => {
        let qDiv = document.createElement("div");
        qDiv.className = "q-card";
        let html = `<div class="q-title">Вопрос ${idx + 1}: ${q.q}</div>`;
        q.options.forEach((opt, oIdx) => {
            html += `<label class="option"><input type="radio" name="q${idx}" value="${oIdx}"> ${opt.text}</label>`;
        });
        html += `<div id="exp${idx}" class="explanation" style="display:none;"></div>`;
        qDiv.innerHTML = html;
        container.appendChild(qDiv);
    });
}

let timeLeft = 600;
let timerElem = document.getElementById("timer");
let timerId = setInterval(() => {
    timeLeft--;
    let m = Math.floor(timeLeft / 60);
    let s = timeLeft % 60;
    timerElem.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    if (timeLeft <= 0) {
        clearInterval(timerId);
        document.getElementById("timeoutAlert").style.display = "flex";
    }
}, 1000);

function submitQuiz() {
    clearInterval(timerId);
    let score = 0;
    questions.forEach((q, idx) => {
        let selected = document.querySelector(`input[name="q${idx}"]:checked`);
        let expDiv = document.getElementById(`exp${idx}`);
        expDiv.style.display = "block";
        
        let correctOpt = q.options.findIndex(o => o.isCorrect);
        if (selected && q.options[parseInt(selected.value)].isCorrect) {
            score++;
            expDiv.className = "explanation exp-correct";
            expDiv.innerHTML = `<b>Верно!</b> ${q.exp}`;
        } else {
            expDiv.className = "explanation exp-incorrect";
            expDiv.innerHTML = `<b>Неверно.</b> Правильный ответ: ${q.options[correctOpt].text}.<br>${q.exp}`;
        }
    });

    let percent = (score / 20) * 100;
    let mark = 1;
    if (percent >= 96) mark = 10;
    else if (percent >= 90) mark = 9;
    else if (percent >= 80) mark = 8;
    else if (percent >= 70) mark = 7;
    else if (percent >= 60) mark = 6;
    else if (percent >= 50) mark = 5;
    else if (percent >= 40) mark = 4;
    else if (percent >= 30) mark = 3;
    else if (percent >= 15) mark = 2;
    else mark = 1;

    let resBox = document.getElementById("result");
    resBox.style.display = "block";
    if (mark >= 3) {
        resBox.className = "result-box pass";
        resBox.innerHTML = `Тест пройден! Верных ответов: ${score} из 20 (${percent}%).<br>Ваша оценка: ${mark} баллов.`;
    } else {
        resBox.className = "result-box fail";
        resBox.innerHTML = `Тест не пройден (порог 3 балла не достигнут). Верных ответов: ${score} из 20.<br>Ваша оценка: ${mark} баллов.`;
    }
    window.scrollTo(0, document.body.scrollHeight);
}

renderQuiz();
</script>
</body>
</html>
