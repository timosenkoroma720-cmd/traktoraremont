<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГРМ — Онлайн Тест 2 (Средний уровень)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .quiz-container { max-width: 850px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .timer-box { position: sticky; top: 10px; background: #e74c3c; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .question-card { background: #f8fafc; border: 1px solid #cbd5e1; border-left: 5px solid #f39c12; padding: 15px 20px; margin-bottom: 20px; border-radius: 6px; }
        .question-card.wrong { border-left-color: #e74c3c; background-color: #fef2f2; }
        .question-card.correct { border-left-color: #2ecc71; background-color: #f0fdf4; }
        .question-text { font-weight: bold; font-size: 16px; margin-bottom: 12px; }
        .option { display: block; margin: 8px 0; padding: 10px 12px; border-radius: 5px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; transition: background 0.2s; }
        .option:hover { background: #e2e8f0; }
        .option.correct-option { background-color: #d1fae5 !important; border-color: #10b981 !important; font-weight: bold; }
        .option.wrong-option { background-color: #fee2e2 !important; border-color: #ef4444 !important; }
        .option input { margin-right: 10px; }
        .btn-submit { display: block; width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #219150; }
        .result-box { margin-top: 25px; padding: 20px; border-radius: 8px; display: none; }
        .explanation { margin-top: 12px; padding: 10px; background: #e2e8f0; border-radius: 5px; font-size: 14px; color: #1e293b; display: none; }
        .status-failed { background: #fee2e2; border: 1px solid #f87171; color: #991b1b; }
        .status-passed { background: #dcfce7; border: 1px solid #4ade80; color: #166534; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>Тест №2: Тепловые зазоры, регулировка и гидрокомпенсаторы</h2>
        <p>20 вопросов с перемешиванием | Ограничение: 10 минут</p>
    </div>

    <div class="timer-box">
        <span>⏱️ Оставшееся время:</span>
        <span id="timer">10:00</span>
    </div>

    <form id="quizForm" style="margin-top: 20px;">
        <div id="questionsContainer"></div>
        <button type="button" class="btn-submit" onclick="finishQuiz(false)">Завершить тест</button>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
const rawQuestions = [
    { q: "Зачем необходим тепловой зазор в клапанном механизме ДВС?", options: ["Для компенсации удлинения стержня клапана при нагреве", "Для увеличения скорости открытия клапанов", "Для заливки масла в цилиндр", "Для уменьшения мощности ДВС"], correct: 0, exp: "При нагреве металл расширяется, и без зазора клапан перестанет плотно закрываться." },
    { q: "К какому опасному последствию приводит слишком МАЛЫЙ тепловой зазор?", options: ["К неполному закрытию клапана, падению компрессии и прогару рабочей фаски", "К стуку клапанов", "К излому распредвала", "К понижению давления воздуха"], correct: 0, exp: "Приоткрытый клапан обгорает под действием раскаленных газов." },
    { q: "К чему приводит слишком БОЛЬШОЙ тепловой зазор в клапанном приводе?", options: ["К металлическим стукам, уменьшению хода клапана и ухудшению наполнения", "К прогару клапанов", "К разрыву масляного фильтра", "К перегреву свечей"], correct: 0, exp: "Увеличенный зазор уменьшает высоту подъема клапана и вызывает стук." },
    { q: "В каком положении цилиндра производится регулировка тепловых зазоров?", options: ["В положении ВМТ такта сжатия (оба клапана полностью закрыты)", "В положениях НМТ такта впуска", "При открытом выпускном клапане", "В любом случайном положении"], correct: 0, exp: "В ВМТ сжатия кулачки повернуты тыльной стороной и не нажимают на клапаны." },
    { q: "Каким измерительным инструментом проверяют величину теплового зазора?", options: ["Плоским пластинчатым щупом", "Штангенциркулем", "Микрометром", "Рулеткой"], correct: 0, exp: "Калиброванные стальные пластины (щупы) позволяют измерить зазор с точностью до сотых долей мм." },
    { q: "Каким образом регулируют зазоры в ГРМ с коромыслами?", options: ["Винтом с контргайкой на коромысле", "Подпиливанием клапана", "Заменой пружины", "Подбором высоты поршня"], correct: 0, exp: "Регулировочный винт меняет положение упора, фиксируясь контргайкой." },
    { q: "Какова главная задача гидрокомпенсаторов (гидротолкателей)?", options: ["Автоматическая выборка теплового зазора без ручной регулировки", "Увеличение давления масла", "Охлаждение распредвала", "Экономия топлива на 50%"], correct: 0, exp: "Гидрокомпенсаторы используют давление масла для беззазорного контакта деталей." },
    { q: "Какое условие критически важно для исправной работы гидрокомпенсаторов?", options: ["Чистота и нормативное давление моторного масла", "Заливка антифриза в масло", "Регулярная подкручивание вручную", "Использование бензина АИ-98"], correct: 0, exp: "Загрязнение масла блокирует шариковый клапан внутри гидрокомпенсатора." },
    { q: "Зачем впускной клапан открывается с опережением (до ВМТ)?", options: ["Чтобы к началу движения поршня вниз проходное сечение канала было уже открыто", "Чтобы выбросить газы во впуск", "Из-за дефекта сборки", "Чтобы уменьшить шум"], correct: 0, exp: "Опережение открытия компенсирует инерцию потока и улучшает наполнение." },
    { q: "Зачем выпускной клапан закрывается с запаздыванием (после ВМТ)?", options: ["Используется инерция выходящих газов для лучшей очистки цилиндра", "Для перегрева двигателя", "Чтобы заклинить поршень", "Для снижения давления масла"], correct: 0, exp: "Инерция выхлопного потока отсасывает остаточные газы из камеры сгорания." },
    { q: "Для чего служит декомпрессионный механизм на некоторых дизельных двигателях?", options: ["Принудительно приоткрывает клапаны для облегчения прокручивания коленвала при пуске", "Для глушения двигателя", "Для подачи пускового эфира", "Для снижения шума"], correct: 0, exp: "Декомпрессор снимает сопротивление сжатия воздуха в цилиндрах во время разгона вала." },
    { q: "Под каким углом чаще всего выполняется рабочая фаска тарелки клапана?", options: ["45° или 30°", "15° или 20°", "90°", "60° или 75°"], correct: 0, exp: "Угол 45° обеспечивает оптимальную герметичность и самоочистку фаски от нагара." },
    { q: "Как проверяется герметичность прилегания клапана к седлу при сборке?", options: ["Заливкой керосина в каналы ГБЦ или контролем притирательной полосы", "Взвешиванием клапана", "Нагревом паяльной лампой", "Замером длины стержня"], correct: 0, exp: "Керосин быстро проникает через наименьшие щели, подтеки показывают негерметичность." },
    { q: "Что происходит при обрыве ремня ГРМ на двигателях, где нет выемок на поршнях?", options: ["Поршни ударяют по открытым клапанам и загибают их", "Двигатель продолжает работать", "Ломается генератор", "Ничего не происходит"], correct: 0, exp: "При остановке распредвала клапаны остаются открытыми и сталкиваются с поршнями." },
    { q: "Для чего в стержень некоторых тяжелых выпускных клапанов помещают натрий?", options: ["Для лучшего отвода тепла от тарелки к направляющей втулке", "Для снижения массы", "Для смазки", "Для защиты от коррозии"], correct: 0, exp: "Жидкий натрий внутри полости эффективно переносит тепло от раскаленной головки клапана." },
    { q: "Что означает аббревиатура DOHC в обозначении системы ГРМ?", options: ["Два распределительных вала в головке блока цилиндров", "Один распредвал в блоке цилиндров", "Нижнее расположение клапанов", "Безраспределительный механизм"], correct: 0, exp: "DOHC (Double Overhead Camshaft) использует два верхних распредвала." },
    { q: "За счет чего достигается поворот клапана вокруг своей оси при работе?", options: ["За счет специального механизма поворота или смещения точки контакта коромысла", "За счет вибрации картера", "Клапан при работе не поворачивается", "За счет потока топлива"], correct: 0, exp: "Поворот клапана предотвращает неравномерный износ фаски и скопление нагара." },
    { q: "Какой элемент передает вращение от коленвала к распредвалу на дизелях типа Д-240?", options: ["Промежуточная шестерня", "Зубчатый ремень", "Двухрядная цепь", "Гидромуфта"], correct: 0, exp: "Шестеренчатая передача с промежуточной шестерней обеспечивает высокую надежность." },
    { q: "Что измеряется при контроле износа распределительного вала?", options: ["Высота (профиль) кулачков и износ опорных шеек", "Длина вала", "Масса вала", "Число зубьев шестерни"], correct: 0, exp: "Износ кулачков снижает ход клапанов и нарушает параметры газообмена." },
    { q: "Зачем на впускных каналах ГБЦ создают специальный винтообразный профиль?", options: ["Для вихревого закручивания поступающего воздуха и лучшего смесеобразования", "Для снижения веса ГБЦ", "Для ускорения слива масла", "Для красоты"], correct: 0, exp: "Закрученный поток воздуха лучше перемешивается с распыленным топливом." }
];

function shuffle(array) {
    let cur = array.length, rIdx;
    while (cur !== 0) {
        rIdx = Math.floor(Math.random() * cur);
        cur--;
        [array[cur], array[rIdx]] = [array[rIdx], array[cur]];
    }
    return array;
}

const quizData = shuffle([...rawQuestions]);
let timeLeft = 600;
let timerInterval;

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        let min = Math.floor(timeLeft / 60);
        let sec = timeLeft % 60;
        document.getElementById('timer').innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            finishQuiz(true);
        }
    }, 1000);
}

function renderQuiz() {
    const container = document.getElementById('questionsContainer');
    quizData.forEach((item, index) => {
        let html = `<div class="question-card" id="card_${index}">
            <div class="question-text">${index + 1}. ${item.q}</div>`;
        item.options.forEach((opt, optIdx) => {
            html += `<label class="option" id="opt_${index}_${optIdx}">
                <input type="radio" name="q${index}" value="${optIdx}"> ${opt}
            </label>`;
        });
        html += `<div class="explanation" id="exp_${index}"><strong>Пояснение:</strong> ${item.exp}</div></div>`;
        container.innerHTML += html;
    });
}

function finishQuiz(isTimeout) {
    clearInterval(timerInterval);
    const inputs = document.querySelectorAll('input[type="radio"]');
    inputs.forEach(i => i.disabled = true);

    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';

    if (isTimeout) {
        resultBox.className = 'result-box status-failed';
        resultBox.innerHTML = `<h2>❌ ТЕСТ НЕ ПРОЙДЕН</h2><p><strong>Время (10 минут) истекло!</strong> Оценка: <strong>2 (Неудовлетворительно)</strong>.</p>`;
        return;
    }

    let score = 0;
    quizData.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const card = document.getElementById(`card_${index}`);
        const exp = document.getElementById(`exp_${index}`);
        exp.style.display = 'block';

        const correctOptEl = document.getElementById(`opt_${index}_${item.correct}`);
        if (correctOptEl) correctOptEl.classList.add('correct-option');

        if (selected) {
            const userAns = parseInt(selected.value);
            if (userAns === item.correct) {
                score++;
                card.classList.add('correct');
            } else {
                card.classList.add('wrong');
                const wrongOptEl = document.getElementById(`opt_${index}_${userAns}`);
                if (wrongOptEl) wrongOptEl.classList.add('wrong-option');
            }
        } else {
            card.classList.add('wrong');
        }
    });

    let mark = "";
    let statusClass = "";
    if (score >= 18) { mark = "5 (Отлично)"; statusClass = "status-passed"; }
    else if (score >= 15) { mark = "4 (Хорошо)"; statusClass = "status-passed"; }
    else if (score >= 10) { mark = "3 (Удовлетворительно)"; statusClass = "status-passed"; }
    else { mark = "2 (Неудовлетворительно)"; statusClass = "status-failed"; }

    resultBox.className = `result-box ${statusClass}`;
    resultBox.innerHTML = `
        <h2>Результаты проверки</h2>
        <p>Правильных ответов: <strong>${score} из ${quizData.length}</strong></p>
        <p>Итоговая оценка: <strong>${mark}</strong></p>
        <hr><p>Правильные ответы подсвечены зеленым цветом, ошибочные — красным.</p>
    `;
}

window.onload = function() {
    renderQuiz();
    startTimer();
};
</script>
</body>
</html>
