<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГРМ — Тест 3 (Сложный уровень)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; margin: 0; padding: 20px; }
        .quiz-card { max-width: 850px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .timer-sticky { position: sticky; top: 10px; background: #e74c3c; color: white; padding: 12px 20px; border-radius: 8px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-align: center; z-index: 1000; box-shadow: 0 4px 10px rgba(231,76,60,0.3); }
        .question-block { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 5px solid #c0392b; padding: 15px 20px; margin-bottom: 20px; border-radius: 6px; }
        .question-title { font-weight: 600; font-size: 16px; margin-bottom: 12px; }
        .option { display: block; margin: 8px 0; padding: 8px 12px; border-radius: 4px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; transition: background 0.2s; }
        .option:hover { background: #f1f5f9; }
        .option input { margin-right: 10px; }
        .btn-submit { display: block; width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #219150; }
        .result-box { margin-top: 25px; padding: 20px; border-radius: 8px; display: none; }
        .explanation { margin-top: 10px; padding: 10px; background: #e2e8f0; border-radius: 4px; font-size: 14px; color: #334155; display: none; }
        .failed { background: #fee2e2; border: 1px solid #f87171; color: #991b1b; }
        .passed { background: #dcfce7; border: 1px solid #4ade80; color: #166534; }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header">
        <h2>Газораспределительный механизм — Тест 3</h2>
        <p>Уровень: Сложный (Диагностика, притирка клапанов, дефектовка и ТО ГРМ)</p>
    </div>

    <div class="timer-sticky">
        <span>⏱️ Оставшееся время:</span>
        <span id="timer">10:00</span>
    </div>

    <form id="quizForm" style="margin-top: 20px;">
        <div id="questionsContainer"></div>
        <button type="button" class="btn-submit" onclick="finishQuiz(false)">Завершить тест</button>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
const rawData = [
    { q: "1. Каковы основные признаки прогара выпускного клапана при работе дизеля?", options: ["Снижение мощности, хлопки в глушитель, падение компрессии в цилиндре", "Высокое давление масла", "Перегрев генератора", "Стук в коробке передач"], correct: 0, exp: "Из-за незакрытого клапана горящие газы вырываются в коллектор, вызывая хлопки и падение давления сжатия." },
    { q: "2. Какой технологический состав применяют для восстановительной притирки клапанов к седлам?", options: ["Абразивную притирочную пасту (грубую и чистовую)", "Моторное масло с песком", "Солидол", "Тормозную жидкость"], correct: 0, exp: "Притирочные пасты содержат микрочастицы абразива для формирования матового герметичного пояса." },
    { q: "3. Каким должен быть матовый поясок на рабочей фаске клапана после правильной притирки?", options: ["Непрерывным, шириной 1,5–2,5 мм по всей окружности", "Прерывистым в трех местах", "Шириной не более 0,1 мм", "Блестящим и полированным"], correct: 0, exp: "Сплошная однородная полоса без черных точек свидетельствует о полной герметичности." },
    { q: "4. Для чего перед обработкой седел клапанов шарошками (фрезами) проверяют износ направляющей втулки?", options: ["Износ втулки приводит к перекосу пилота шарошки и неправильной подрезке седла", "Чтобы подобрать масло", "Это не имеет значения", "Чтобы выбить седло"], correct: 0, exp: "Центрирующий пилот инструмента вставляется во втулку; люфт приведет к несоосности седла и клапана." },
    { q: "5. Какая процедура выполняется для восстановления профиля седла клапана при ремонте ГБЦ?", options: ["Обработка зенкерами (шарошками) с углами 15°, 45° (или 30°) и 60°", "Наплавка чугуном", "Шлифовка напильником", "Промывка бензином"], correct: 0, exp: "Разноугольные фрезы формируют рабочую фаску 45° нужной ширины и центрируют её по тарелке." },
    { q: "6. Какой дефект направляющей втулки клапана приводит к повышенному расходу масла («масложору»)?", options: ["Износ внутреннего отверстия втулки (увеличенный зазор со стержнем клапана)", "Трещина снаружи", "Слишком малый зазор", "Потемнение металла"], correct: 0, exp: "Зазор создаёт насосный эффект, засасывая масло через колпачки в коллектор и цилиндр." },
    { q: "7. Из-за чего возникает характерный «звонкий» металлический стук в верхней части двигателя?", options: ["Увеличенный тепловой зазор между коромыслом и клапаном", "Износ коренных подшипников", "Попадание воды в бак", "Слабое натяжение ремня генератора"], correct: 0, exp: "Удар коромысла по стержню клапана при завышенном зазоре издает отчетливый звонкий стук." },
    { q: "8. Как влияет сильный износ опорных шеек распределительного вала на систему смазки ДВС?", options: ["Падает общее давление масла в магистрали двигателя", "Давление масла растет", "Масло закипает", "Никак не влияет"], correct: 0, exp: "Зазоры в подшипниках распредвала пропускают масляный поток, что снижает давление в системе." },
    { q: "9. Чем проверяют коробоватость (неплоскостность) привалочной поверхности головки блока цилиндров?", options: ["Поверочной линейкой и плоским щупом", "Штангенциркулем", "Нутромером", "Отвесом"], correct: 0, exp: "Линейку кладут по диагоналям и вдоль ГБЦ, контролируя зазоры щупом." },
    { q: "10. Какое повреждение клапана НЕ ДОПУСКАЕТСЯ ремонтировать, а требует только замены?", options: ["Трещины, изгиб стержня, прогар тарелки", "Небольшой нагар", "Потемнение стержня", "Стертый торцовый след"], correct: 0, exp: "Деформированные, дефектные и прогоревшие клапаны подлежат обязательной замене." },
    { q: "11. Каким прибором можно определить негерметичность клапанов без разборки двигателя?", options: ["Пневмотестером (по утечке сжатого воздуха из цилиндра)", "Ареометром", "Амперметром", "Вольтметром"], correct: 0, exp: "Пневмотестер подает воздух в цилиндр при ВМТ; шипение во впуске или глушителе указывает на негерметичный клапан." },
    { q: "12. Из-за чего происходит преждевременный износ и растрескивание маслосъемных колпачков?", options: ["Из-за перегрева ДВС и воздействия агрессивного или некачественного масла", "Из-за высокой скорости движения", "Из-за работы на холостом ходу", "Из-за частого мытья двигателя"], correct: 0, exp: "Высокая температура «сушит» резину, она теряет эластичность и перестает удерживать масло." },
    { q: "13. Каким образом контролируют упругость клапанных пружин при дефектовке?", options: ["Сжатием на специальном приборе с контролем усилия и длины в сжатом состоянии", "Взвешиванием на весах", "Простукиванием молотком", "Измерением диаметра проволоки"], correct: 0, exp: "Специальный стенд проверяет силу упругости пружины при рабочей высоте сжатия." },
    { q: "14. К чему приводит постоянная эксплуатация дизеля с «зажатыми» (без зазора) клапанами?", options: ["К быстрому прогару фасок клапанов и седел", "К экономии топлива", "К увеличению ресурса", "К снижению шума без последствий"], correct: 0, exp: "Отсутствие зазора не дает клапану отдать тепло седлу, что вызывает локальный перегрев и прогар." },
    { q: "15. Какая операция обязательна при замене направляющих втулок клапанов в ГБЦ?", options: ["Развертывание внутреннего отверстия втулки специальной разверткой под номинальный размер", "Приварка втулки", "Смазка солидолом без обработки", "Шлифовка наружного диаметра"], correct: 0, exp: "После запрессовки внутренний диаметр втулки деформируется и требует финишной калибровки разверткой." },
    { q: "16. Какое влияние оказывает износ зубьев или растяжение цепи/ремня ГРМ на фазы газораспределения?", options: ["Сдвигает фазы в сторону запаздывания, ухудшая мощность и пуск ДВС", "Улучшает динамику", "Увеличивает компрессию", "Никак не влияет"], correct: 0, exp: "Люфты и растяжения приводят к отставанию распредвала от коленвала." },
    { q: "17. Для чего при шлифовке торца стержня клапана после ремонта снимают фаску?", options: ["Чтобы предотвратить расклепывание и заклинивание стержня во втулке", "Для снижения массы", "Для улучшения подачи масла", "Для красоты"], correct: 0, exp: "Острая кромка без фаски под ударами коромысла быстро образует заусенец." },
    { q: "18. В какой последовательности ослабляют болты ГБЦ при ее демонтаже?", options: ["От краев к центру (обратно порядку затяжки)", "От центра к краям", "Все сразу", "По часовой стрелке"], correct: 0, exp: "Ослабление от краев к центру предотвращает возникновение внутренних напряжений и коробление головки." },
    { q: "19. Какой зазор проверяют между стержнем клапана и направляющей втулкой при дефектовке?", options: ["Радиальный (боковой) зазор индикатором часового типа", "Длину втулки", "Шаг нарезки", "Ширину фаски"], correct: 0, exp: "Отклонение стержня при выдвинутом клапане замеряют индикатором для оценки износа пары." },
    { q: "20. Что проверяют в ГРМ при проведении Технического обслуживания (ТО-2)?", options: ["Тепловые зазоры в клапанном механизме и крепление стоек осей коромысел", "Замену всех клапанов", "Шлифовку распредвала", "Замену ГБЦ"], correct: 0, exp: "При ТО-2 контролируют и при необходимости регулируют клапанные зазоры и затяжку крепежа." }
];

function shuffle(array) {
    let cur = array.length, rIndex;
    while (cur !== 0) {
        rIndex = Math.floor(Math.random() * cur);
        cur--;
        [array[cur], array[rIndex]] = [array[rIndex], array[cur]];
    }
    return array;
}

const quizData = shuffle([...rawData]);

let timeLeft = 600;
let timerInterval;

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        let min = Math.floor(timeLeft / 60);
        let sec = timeLeft % 60;
        document.getElementById('timer').innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            finishQuiz(true);
        }
    }, 1000);
}

function renderQuiz() {
    const container = document.getElementById('questionsContainer');
    quizData.forEach((item, index) => {
        let html = `<div class="question-block">
            <div class="question-title">${index + 1}. ${item.q}</div>`;
        item.options.forEach((opt, optIdx) => {
            html += `<label class="option">
                <input type="radio" name="q${index}" value="${optIdx}"> ${opt}
            </label>`;
        });
        html += `<div class="explanation" id="exp_${index}"><strong>Пояснение:</strong> ${item.exp}</div></div>`;
        container.innerHTML += html;
    });
}

function finishQuiz(isTimeout) {
    clearInterval(timerInterval);
    const inputs = document.querySelectorAll('input[type="radio"]');
    inputs.forEach(i => i.disabled = true);

    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';

    quizData.forEach((_, index) => {
        document.getElementById(`exp_${index}`).style.display = 'block';
    });

    if (isTimeout) {
        resultBox.className = 'result-box failed';
        resultBox.innerHTML = `
            <h2>❌ ТЕСТ НЕ ПРОЙДЕН</h2>
            <p><strong>Причина:</strong> Время отведенное на тест (10 минут) истекло!</p>
            <p>Итоговая оценка: <strong>2 (Неудовлетворительно)</strong></p>
            <p>Ознакомьтесь с правильными ответами и пояснениями ниже.</p>
        `;
        return;
    }

    let score = 0;
    quizData.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if (selected && parseInt(selected.value) === item.correct) {
            score++;
        }
    });

    let mark = "";
    let statusClass = "";

    if (score >= 18) { mark = "5 (Отлично)"; statusClass = "passed"; }
    else if (score >= 15) { mark = "4 (Хорошо)"; statusClass = "passed"; }
    else if (score >= 10) { mark = "3 (Удовлетворительно)"; statusClass = "passed"; }
    else { mark = "2 (Неудовлетворительно)"; statusClass = "failed"; }

    resultBox.className = `result-box ${statusClass}`;
    resultBox.innerHTML = `
        <h2>Результаты тестирования</h2>
        <p>Правильных ответов: <strong>${score} из ${quizData.length}</strong></p>
        <p>Итоговая оценка: <strong>${mark}</strong></p>
        <hr>
        <p>Ниже представлены правильные ответы и пояснения к каждому вопросу.</p>
    `;
}

window.onload = function() {
    renderQuiz();
    startTimer();
};
</script>
</body>
</html>
