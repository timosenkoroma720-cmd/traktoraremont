<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГРМ — Онлайн Тест 3 (Сложный уровень)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .quiz-container { max-width: 850px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .timer-box { position: sticky; top: 10px; background: #e74c3c; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .question-card { background: #f8fafc; border: 1px solid #cbd5e1; border-left: 5px solid #c0392b; padding: 15px 20px; margin-bottom: 20px; border-radius: 6px; }
        .question-card.wrong { border-left-color: #e74c3c; background-color: #fef2f2; }
        .question-card.correct { border-left-color: #2ecc71; background-color: #f0fdf4; }
        .question-text { font-weight: bold; font-size: 16px; margin-bottom: 12px; }
        .option { display: block; margin: 8px 0; padding: 10px 12px; border-radius: 5px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; transition: background 0.2s; }
        .option:hover { background: #e2e8f0; }
        .option.correct-option { background-color: #d1fae5 !important; border-color: #10b981 !important; font-weight: bold; }
        .option.wrong-option { background-color: #fee2e2 !important; border-color: #ef4444 !important; }
        .option input { margin-right: 10px; }
        .btn-submit { display: block; width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #219150; }
        .result-box { margin-top: 25px; padding: 20px; border-radius: 8px; display: none; }
        .explanation { margin-top: 12px; padding: 10px; background: #e2e8f0; border-radius: 5px; font-size: 14px; color: #1e293b; display: none; }
        .status-failed { background: #fee2e2; border: 1px solid #f87171; color: #991b1b; }
        .status-passed { background: #dcfce7; border: 1px solid #4ade80; color: #166534; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>Тест №3: Диагностика, ремонт, притирка и дефектовка ГРМ</h2>
        <p>20 вопросов с перемешиванием | Ограничение: 10 минут</p>
    </div>

    <div class="timer-box">
        <span>⏱️ Оставшееся время:</span>
        <span id="timer">10:00</span>
    </div>

    <form id="quizForm" style="margin-top: 20px;">
        <div id="questionsContainer"></div>
        <button type="button" class="btn-submit" onclick="finishQuiz(false)">Завершить тест</button>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
const rawQuestions = [
    { q: "Каковы основные признаки прогара выпускного клапана ДВС?", options: ["Снижение мощности, хлопки в глушитель, резкое падение компрессии", "Высокое давление масла в двигателе", "Перегрев генератора", "Стук в коробке передач"], correct: 0, exp: "Горящие газы прорываются в глушитель через образовавшуюся щель, вызывая хлопки и падение давления." },
    { q: "Какой состав используется для качественной притирки клапанов к седлам?", options: ["Специальная абразивная притирочная паста", "Моторное масло с песком", "Обычный солидол", "Тормозная жидкость"], correct: 0, exp: "Притирочная паста содержит точно дозированный микроабразив." },
    { q: "Каким должен быть матовый поясок на рабочей фаске клапана после притирки?", options: ["Сплошным, шириной около 1,5–2,5 мм по всей окружности", "Прерывистым в двух местах", "Шириной не более 0,1 мм", "Глянцевым и полированным"], correct: 0, exp: "Сплошная полоса без темных рисок говорит о полной герметичности прилегания." },
    { q: "Зачем перед фрезерованием (шарошкой) седел проверяют износ направляющих втулок?", options: ["Люфт втулки вызовет перекос пилота шарошки и несоосность фаски седла", "Чтобы рассчитать объем масла", "Это делать не обязательно", "Чтобы измерить высоту ГБЦ"], correct: 0, exp: "Пилот шарошки центрируется именно по внутренней поверхности направляющей втулки." },
    { q: "Какими углами обработочных фрез (зенкеров) формируют фаску седла клапана?", options: ["15°, 45° (или 30°) и 60°", "Только 90°", "10°, 20° и 80°", "5° и 120°"], correct: 0, exp: "Углами 15° и 60° сужают рабочую фаску 45° до нормативной ширины и центрируют ее." },
    { q: "Какой дефект направляющей втулки вызывает повышенный расход моторного масла?", options: ["Увеличенный зазор между стержнем клапана и втулкой из-за износа", "Малый зазор", "Трещина на корпусе ГБЦ", "Потемнение метала"], correct: 0, exp: "Через изношенный зазор масло разрежением засасывается в коллектор и сгорает." },
    { q: "Из-за чего в зоне ГРМ появляется характерный звонкий металлический стук?", options: ["Увеличенный тепловой зазор в клапанном механизме", "Слишком малый зазор", "Износ шатунных вкладышей", "Разрядка аккумулятора"], correct: 0, exp: "Увеличенный зазор вызывает удар носка коромысла или толкателя по стержню клапана." },
    { q: "Как сильный износ опорных шеек распредвала влияет на работу ДВС?", options: ["Падает общее давление масла в системе смазки", "Давление масла растет", "Топливо начинает закипать", "Никак не влияет"], correct: 0, exp: "Изношенные зазоры в подшипниках скольжения распредвала сбрасывают масло." },
    { q: "Чем контролируют деформацию (коробоватость) привалочной поверхности ГБЦ?", options: ["Поверочной линейкой и плоским щупом", "Штангенциркулем", "Нутромером", "Ареометром"], correct: 0, exp: "Линейка накладывается по диагоналям и вдоль блока, а щупом проверяют зазор." },
    { q: "Какое повреждение клапана НЕ ДОПУСКАЕТ его дальнейшую эксплуатацию и ремонт?", options: ["Трещины, изгиб стержня, прогар тарелки", "Легкий нагар на тарелке", "Стертый торцовый след", "Потемнение стержня"], correct: 0, exp: "Деформированные или прогоревшие клапаны подлежат безальтернативной замене." },
    { q: "Каким прибором проверяют негерметичность клапанов без демонтажа ГБЦ?", options: ["Пневмотестером (по утечкам воздуха)", "Ареометром", "Вольтметром", "Манометром шинным"], correct: 0, exp: "Воздух подается в цилиндр при ВМТ; выход воздуха во впуск или выпуск указывает на негерметичность." },
    { q: "Из-за чего быстро дубеют и растрескиваются маслосъемные колпачки?", options: ["Перегрев двигателя и применение некачественного масла", "Работа на холостом ходу", "Частая замена фильтра", "Езда на высокой скорости"], correct: 0, exp: "Высокая температура ускоряет старение резины и приводит к потере эластичности." },
    { q: "Как контролируют состояние клапанных пружин при дефектовке?", options: ["Проверкой длины в свободном состоянии и усилия сжатия под рабочей нагрузкой", "Взвешиванием на весах", "Простукиванием молотком", "Измерением цвета"], correct: 0, exp: "Проседание или ослабление пружины вызывает зависание клапанов на высоких оборотах." },
    { q: "Чем опасна постоянная эксплуатация дизеля с «зажатыми» (без зазора) клапанами?", options: ["Быстрым прогаром рабочих фасок клапанов и седел", "Увеличением мощности", "Экономией солярки", "Увеличением ресурса"], correct: 0, exp: "Отсутствие зазора лишает клапан контакта с седлом, перекрывая отвод тепла." },
    { q: "Какая операция обязательна после запрессовки новой направляющей втулки клапана?", options: ["Развертывание внутреннего отверстия разверткой до номинального размера", "Приварка втулки", "Смазка солидолом", "Шлифовка тарелки"], correct: 0, exp: "При запрессовке внутреннее отверстие втулки утягивается и требует калибровки." },
    { q: "Как влияет растяжение цепи ГРМ на работу двигателя?", options: ["Сдвигает фазы газораспределения в сторону запаздывания", "Увеличивает мощность", "Увеличивает компрессию", "Никак не влияет"], correct: 0, exp: "Растяжение приводит к отставанию распредвала от коленвала." },
    { q: "Зачем при шлифовке торца стержня клапана после ремонта снимают фаску?", options: ["Чтобы предотвратить расклепывание и заклинивание стержня во втулке", "Для уменьшения массы", "Для подачи масла", "Для красоты"], correct: 0, exp: "Удары толкателя расклепывают торцовые кромки стержня без фаски." },
    { q: "В какой последовательности ослабляют болты ГБЦ при ее демонтаже?", options: ["От краев к центру (обратно порядку затяжки)", "От центра к краям", "В произвольном порядке", "Только по часовой стрелке"], correct: 0, exp: "Постепенное ослабление от краев к центру предотвращает коробление ГБЦ." },
    { q: "Как измеряют радиальный износ пары «стержень клапана — втулка»?", options: ["Индикатором часового типа при приподнятом клапане", "Микрометром по длине", "Линейкой", "Глубиномером"], correct: 0, exp: "Индикатор фиксирует величину бокового качания клапана." },
    { q: "Что входит в обязательный объем работ по ГРМ при проведении ТО-2?", options: ["Проверка и регулировка тепловых зазоров, проверка крепления деталей", "Полная замена клапанов", "Замена распредвала", "Шлифовка ГБЦ"], correct: 0, exp: "ТО-2 включает контрольно-регулировочные работы по зазорам и крепежу." }
];

function shuffle(array) {
    let cur = array.length, rIdx;
    while (cur !== 0) {
        rIdx = Math.floor(Math.random() * cur);
        cur--;
        [array[cur], array[rIdx]] = [array[rIdx], array[cur]];
    }
    return array;
}

const quizData = shuffle([...rawQuestions]);
let timeLeft = 600;
let timerInterval;

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        let min = Math.floor(timeLeft / 60);
        let sec = timeLeft % 60;
        document.getElementById('timer').innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            finishQuiz(true);
        }
    }, 1000);
}

function renderQuiz() {
    const container = document.getElementById('questionsContainer');
    quizData.forEach((item, index) => {
        let html = `<div class="question-card" id="card_${index}">
            <div class="question-text">${index + 1}. ${item.q}</div>`;
        item.options.forEach((opt, optIdx) => {
            html += `<label class="option" id="opt_${index}_${optIdx}">
                <input type="radio" name="q${index}" value="${optIdx}"> ${opt}
            </label>`;
        });
        html += `<div class="explanation" id="exp_${index}"><strong>Пояснение:</strong> ${item.exp}</div></div>`;
        container.innerHTML += html;
    });
}

function finishQuiz(isTimeout) {
    clearInterval(timerInterval);
    const inputs = document.querySelectorAll('input[type="radio"]');
    inputs.forEach(i => i.disabled = true);

    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';

    if (isTimeout) {
        resultBox.className = 'result-box status-failed';
        resultBox.innerHTML = `<h2>❌ ТЕСТ НЕ ПРОЙДЕН</h2><p><strong>Время (10 минут) истекло!</strong> Оценка: <strong>2 (Неудовлетворительно)</strong>.</p>`;
        return;
    }

    let score = 0;
    quizData.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const card = document.getElementById(`card_${index}`);
        const exp = document.getElementById(`exp_${index}`);
        exp.style.display = 'block';

        const correctOptEl = document.getElementById(`opt_${index}_${item.correct}`);
        if (correctOptEl) correctOptEl.classList.add('correct-option');

        if (selected) {
            const userAns = parseInt(selected.value);
            if (userAns === item.correct) {
                score++;
                card.classList.add('correct');
            } else {
                card.classList.add('wrong');
                const wrongOptEl = document.getElementById(`opt_${index}_${userAns}`);
                if (wrongOptEl) wrongOptEl.classList.add('wrong-option');
            }
        } else {
            card.classList.add('wrong');
        }
    });

    let mark = "";
    let statusClass = "";
    if (score >= 18) { mark = "5 (Отлично)"; statusClass = "status-passed"; }
    else if (score >= 15) { mark = "4 (Хорошо)"; statusClass = "status-passed"; }
    else if (score >= 10) { mark = "3 (Удовлетворительно)"; statusClass = "status-passed"; }
    else { mark = "2 (Неудовлетворительно)"; statusClass = "status-failed"; }

    resultBox.className = `result-box ${statusClass}`;
    resultBox.innerHTML = `
        <h2>Результаты проверки</h2>
        <p>Правильных ответов: <strong>${score} из ${quizData.length}</strong></p>
        <p>Итоговая оценка: <strong>${mark}</strong></p>
        <hr><p>Правильные ответы подсвечены зеленым цветом, ошибочные — красным.</p>
    `;
}

window.onload = function() {
    renderQuiz();
    startTimer();
};
</script>
</body>
</html>
