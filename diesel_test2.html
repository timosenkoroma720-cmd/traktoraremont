<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система питания дизеля — Онлайн Тест 2 (Средний уровень)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .quiz-container { max-width: 850px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .timer-box { position: sticky; top: 10px; background: #e74c3c; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .question-card { background: #f8fafc; border: 1px solid #cbd5e1; border-left: 5px solid #f39c12; padding: 15px 20px; margin-bottom: 20px; border-radius: 6px; }
        .question-card.wrong { border-left-color: #e74c3c; background-color: #fef2f2; }
        .question-card.correct { border-left-color: #2ecc71; background-color: #f0fdf4; }
        .question-text { font-weight: bold; font-size: 16px; margin-bottom: 12px; }
        .option { display: block; margin: 8px 0; padding: 10px 12px; border-radius: 5px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; transition: background 0.2s; }
        .option:hover { background: #e2e8f0; }
        .option.correct-option { background-color: #d1fae5 !important; border-color: #10b981 !important; font-weight: bold; }
        .option.wrong-option { background-color: #fee2e2 !important; border-color: #ef4444 !important; }
        .option input { margin-right: 10px; }
        .btn-submit { display: block; width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #219150; }
        .result-box { margin-top: 25px; padding: 20px; border-radius: 8px; display: none; }
        .explanation { margin-top: 12px; padding: 10px; background: #e2e8f0; border-radius: 5px; font-size: 14px; color: #1e293b; display: none; }
        .status-failed { background: #fee2e2; border: 1px solid #f87171; color: #991b1b; }
        .status-passed { background: #dcfce7; border: 1px solid #4ade80; color: #166534; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>Тест №2: ТНВД, аккумуляторы давления, Common Rail и форсунки</h2>
        <p>20 вопросов с перемешиванием | Ограничение: 10 минут</p>
    </div>

    <div class="timer-box">
        <span>⏱️ Оставшееся время:</span>
        <span id="timer">10:00</span>
    </div>

    <form id="quizForm" style="margin-top: 20px;">
        <div id="questionsContainer"></div>
        <button type="button" class="btn-submit" onclick="finishQuiz(false)">Завершить тест</button>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
const rawQuestions = [
    { q: "Что представляет собой плунжерная пара ТНВД?", options: ["Плунжер (поршень) и втулка (цилиндр) с высочайшей точностью подогнаны друг к другу", "Шестерня и корпус насоса", "Клапан и пружина", "Подшипник и вал"], correct: 0, exp: "Плунжерная пара является основным рабочим элементом ТНВД, где зазор составляет от 1 до 3 микрон." },
    { q: "Как изменяется количество подаваемого топлива в секции классического рядногo ТНВД?", options: ["Поворотом плунжера вокруг своей оси с помощью спиральной отсечной канавки", "Изменением длины хода кулачка", "Изменением диаметра впускного клапана", "Изменением оборотов вентилятора"], correct: 0, exp: "При повороте плунжера отсечная канавка раньше или позже соединяет надплунжерное пространство со сливом." },
    { q: "В чем главное отличие системы Common Rail от классических ТНВД?", options: ["Создание высокого давления в общей рампе независимо от оборотов двигателя", "Отсутствие форсунок", "Использование бензина вместо солярки", "Отсутствие электронного блока управления"], correct: 0, exp: "В Common Rail аккумулятором давления выступает рампа, а момент и доза впрыска управляются ЭБУ." },
    { q: "Какое максимальное давление создают современные системы Common Rail (3-го и 4-го поколений)?", options: ["До 2000–2500 бар (200–250 МПа)", "До 50 бар", "До 300 бар", "До 10 000 бар"], correct: 0, exp: "Давление в современных аккумуляторах Common Rail достигает 2200–2500 бар для ультрамелкого распыла." },
    { q: "Что такое пьезоэлектрическая форсунка (пьезофорсунка)?", options: ["Форсунка, использующая расширение пьезокристаллов под напряжением для сверхбыстрого открытия", "Форсунка с зажиганием от искры", "Форсунка, работающая от давления воздуха", "Форсунка с ручным приводом"], correct: 0, exp: "Пьезоактюатор срабатывает в 4-5 раз быстрее электромагнитного клапана, позволяя делать до 8 впрысков за цикл." },
    { q: "Для чего в современных дизелях применяется предвпрыск (пилотный впрыск)?", options: ["Для снижения жесткости сгорания, шума и уменьшения выбросов NOx", "Для продувки выхлопного тракта", "Для охлаждения цилиндра", "Для увеличения расхода топлива"], correct: 0, exp: "Малая доза топлива плавно поднимает температуру в цилиндре перед основным впрыском." },
    { q: "Какую роль выполняет датчик давления топлива в рампе Common Rail?", options: ["Передает данные на ЭБУ для управления клапаном-регулятором давления", "Отключает аккумулятор", "Показывает уровень топлива в баке", "Включает свечи накала"], correct: 0, exp: "ЭБУ непрерывно отслеживает фактическое давление в рампе и корректирует работу клапанов." },
    { q: "Что из себя представляет насос-форсунка?", options: ["Узел, объединяющий плунжерный насос высокого давления и распылитель в одном корпусе", "Обычный топливный фильтр", "Электрический насос в баке", "Клапан сброса давления"], correct: 0, exp: "Насос-форсунка устанавливается в ГБЦ индивидуально на каждый цилиндр и приводится кулачком распредвала." },
    { q: "Зачем в ТНВД распределительного типа (например, Bosch VE) используется один плунжер?", options: ["Один плунжер совершает возвратно-поступательное и вращательное движение, подавая топливо во все цилиндры", "Он питает только один цилиндр", "Для охлаждения масла", "Для защиты от воды"], correct: 0, exp: "Распределительный плунжер за один оборот поочередно обслуживает все форсунки двигателя." },
    { q: "Какую функцию выполняет нагнетательный клапан ТНВД?", options: ["Быстро отсекает подачу и разгружает магистраль высокого давления для предотвращения подкапывания", "Фильтрует солярку", "Увеличивает объем топлива в баке", "Нагнетает воздух во впуск"], correct: 0, exp: "Клапан стравливает остаточное давление из трубки, чтобы игла форсунки садилась четко и без капель." },
    { q: "Зачем в дизельных системах с Common Rail устанавливается охладитель топлива на обратной магистрали?", options: ["Топливо в рампе сильного сжимается и нагревается, слив горячего топлива может повредить пластиковый бак", "Чтобы заморозить воду", "Для подогрева салона", "Для конденсирования газов"], correct: 0, exp: "Сжатие до 2000 бар сильно нагревает дизтопливо, поэтому слив в бак требует охлаждения." },
    { q: "Что такое «мультипликатор давления» в гидравлической форсунке Common Rail?", options: ["Поршень управления, который передает давление топлива на иглу распылителя", "Устройство для смешивания с воздухом", "Регулятор оборотов", "Электрический трансформер"], correct: 0, exp: "Мультипликатор уравновешивает или стравливает давление над иглой для ее подъема." },
    { q: "Какое преимущество дает использование многоструйных распылителей с 6–8 отверстиями?", options: ["Равномерное распределение факела топлива по всему объему камеры сгорания", "Уменьшение давления впрыска", "Быстрый слив топлива в бак", "Упрощение конструкции"], correct: 0, exp: "Множество микронных отверстий равномерно заполняет топливной взвесью коаксиальную чашу поршня." },
    { q: "Как называется клапан, удерживающий заданный уровень давления в рампе Common Rail?", options: ["Регулятор давления топлива (PCV / DRV)", "Обратный клапан бака", "Перепускной клапан фильтра", "Дроссельный клапан"], correct: 0, exp: "Клапан регулировки давления сбрасывает избыток топлива из рампы обратно в сливную магистраль." },
    { q: "Что происходит с топливом в цилиндре во время «поствпрыска» (дополнительного впрыска на такте расширения/выпуска)?", options: ["Топливо попадает в выпускной тракт для разогрева сажевого фильтра (DPF)", "Увеличивает мощность на 50%", "Охлаждает поршень", "Снижает давление в рампе"], correct: 0, exp: "Поствпрыск применяется для процесса активной регенерации сажевого фильтра." },
    { q: "За счет чего происходит подъем иглы в электромагнитной форсунке Common Rail?", options: ["За счет стравливания давления из управляющей камеры над мультипликатором", "Прямым механическим действием магнита на иглу", "За счет подкачки воздуха", "Под действием пружины"], correct: 0, exp: "Электромагнит открывает управляющий клапан, давление над поршнем падает, и высокое давление снизу поднимает иглу." },
    { q: "Какое масло используется для смазки деталей плунжерных пар ТНВД современных дизелей?", options: ["Прокачиваемое через них дизельное топливо", "Моторное масло из картера", "Трансмиссионная смазка", "Пластичная смазка Литол"], correct: 0, exp: "Современные ТНВД смазываются исключительно проходящим через них дизельным топливом." },
    { q: "Зачем на входе в ТНВД Common Rail часто устанавливают дозирующий клапан (VCV / ZME)?", options: ["Чтобы насос сжимал только необходимый для текущего режима объем топлива", "Чтобы полностью перекрывать воздух", "Для измерения температуры", "Для разгона турбины"], correct: 0, exp: "Дозирование на входе снижает затраты мощности двигателя на привод ТНВД и уменьшает нагрев топлива." },
    { q: "Что измеряет датчик температуры топлива в дизельной системе?", options: ["Плотность топлива для корректировки ЭБУ длительности впрыска", "Уровень масла", "Температуру выхлопных газов", "Загрязнение фильтра"], correct: 0, exp: "При нагреве плотность и вязкость дизтоплива падают, поэтому ЭБУ вносит температурную компенсацию." },
    { q: "Как вихревые заслонки во впускном коллекторе влияют на смесеобразование?", options: ["Перекрывают часть каналов на малых нагрузках для создания интенсивного завихрения воздуха", "Уменьшают компрессию", "Отсекают подачу топлива", "Фильтруют поступающий воздух"], correct: 0, exp: "Вихревое движение улучшает перемешивание топлива с воздухом на низких оборотах." }
];

function shuffle(array) {
    let cur = array.length, rIdx;
    while (cur !== 0) {
        rIdx = Math.floor(Math.random() * cur);
        cur--;
        [array[cur], array[rIdx]] = [array[rIdx], array[cur]];
    }
    return array;
}

const quizData = shuffle([...rawQuestions]);
let timeLeft = 600;
let timerInterval;

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        let min = Math.floor(timeLeft / 60);
        let sec = timeLeft % 60;
        document.getElementById('timer').innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            finishQuiz(true);
        }
    }, 1000);
}

function renderQuiz() {
    const container = document.getElementById('questionsContainer');
    quizData.forEach((item, index) => {
        let html = `<div class="question-card" id="card_${index}">
            <div class="question-text">${index + 1}. ${item.q}</div>`;
        item.options.forEach((opt, optIdx) => {
            html += `<label class="option" id="opt_${index}_${optIdx}">
                <input type="radio" name="q${index}" value="${optIdx}"> ${opt}
            </label>`;
        });
        html += `<div class="explanation" id="exp_${index}"><strong>Пояснение:</strong> ${item.exp}</div></div>`;
        container.innerHTML += html;
    });
}

function finishQuiz(isTimeout) {
    clearInterval(timerInterval);
    const inputs = document.querySelectorAll('input[type="radio"]');
    inputs.forEach(i => i.disabled = true);

    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';

    if (isTimeout) {
        resultBox.className = 'result-box status-failed';
        resultBox.innerHTML = `<h2>❌ ТЕСТ НЕ ПРОЙДЕН</h2><p><strong>Время (10 минут) истекло!</strong> Оценка: <strong>2 (Неудовлетворительно)</strong>.</p>`;
        return;
    }

    let score = 0;
    quizData.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const card = document.getElementById(`card_${index}`);
        const exp = document.getElementById(`exp_${index}`);
        exp.style.display = 'block';

        const correctOptEl = document.getElementById(`opt_${index}_${item.correct}`);
        if (correctOptEl) correctOptEl.classList.add('correct-option');

        if (selected) {
            const userAns = parseInt(selected.value);
            if (userAns === item.correct) {
                score++;
                card.classList.add('correct');
            } else {
                card.classList.add('wrong');
                const wrongOptEl = document.getElementById(`opt_${index}_${userAns}`);
                if (wrongOptEl) wrongOptEl.classList.add('wrong-option');
            }
        } else {
            card.classList.add('wrong');
        }
    });

    let mark = "";
    let statusClass = "";
    if (score >= 18) { mark = "5 (Отлично)"; statusClass = "status-passed"; }
    else if (score >= 15) { mark = "4 (Хорошо)"; statusClass = "status-passed"; }
    else if (score >= 10) { mark = "3 (Удовлетворительно)"; statusClass = "status-passed"; }
    else { mark = "2 (Неудовлетворительно)"; statusClass = "status-failed"; }

    resultBox.className = `result-box ${statusClass}`;
    resultBox.innerHTML = `
        <h2>Результаты проверки</h2>
        <p>Правильных ответов: <strong>${score} из ${quizData.length}</strong></p>
        <p>Итоговая оценка: <strong>${mark}</strong></p>
        <hr><p>Правильные ответы подсвечены зеленым цветом, ошибочные — красным.</p>
    `;
}

window.onload = function() {
    renderQuiz();
    startTimer();
};
</script>
</body>
</html>
