<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГРМ — Онлайн Тест 1 (Базовый уровень)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .quiz-container { max-width: 850px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .timer-box { position: sticky; top: 10px; background: #e74c3c; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .question-card { background: #f8fafc; border: 1px solid #cbd5e1; border-left: 5px solid #3498db; padding: 15px 20px; margin-bottom: 20px; border-radius: 6px; }
        .question-card.wrong { border-left-color: #e74c3c; background-color: #fef2f2; }
        .question-card.correct { border-left-color: #2ecc71; background-color: #f0fdf4; }
        .question-text { font-weight: bold; font-size: 16px; margin-bottom: 12px; }
        .option { display: block; margin: 8px 0; padding: 10px 12px; border-radius: 5px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; transition: background 0.2s; }
        .option:hover { background: #e2e8f0; }
        .option.correct-option { background-color: #d1fae5 !important; border-color: #10b981 !important; font-weight: bold; }
        .option.wrong-option { background-color: #fee2e2 !important; border-color: #ef4444 !important; }
        .option input { margin-right: 10px; }
        .btn-submit { display: block; width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #219150; }
        .result-box { margin-top: 25px; padding: 20px; border-radius: 8px; display: none; }
        .explanation { margin-top: 12px; padding: 10px; background: #e2e8f0; border-radius: 5px; font-size: 14px; color: #1e293b; display: none; }
        .status-failed { background: #fee2e2; border: 1px solid #f87171; color: #991b1b; }
        .status-passed { background: #dcfce7; border: 1px solid #4ade80; color: #166534; }

        /* Окно ввода ФИО */
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .auth-modal { background: white; padding: 30px; border-radius: 10px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .auth-modal input { width: 100%; padding: 12px; margin: 15px 0; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        .auth-modal button { padding: 12px 24px; background: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .auth-modal button:hover { background: #219150; }
    </style>
</head>
<body>

<!-- Модальное окно авторизации -->
<div id="authModal" class="auth-overlay">
    <div class="auth-modal">
        <h3>Регистрация перед тестом</h3>
        <p>Введите ваши Фамилию, Имя и Отчество:</p>
        <input type="text" id="studentNameInput" placeholder="ФИО ученика..." required>
        <button type="button" onclick="startQuiz()">Начать тест</button>
    </div>
</div>

<div class="quiz-container">
    <div class="header">
        <h2>Тест №1: Назначение, типы и устройство ГРМ</h2>
        <p>20 вопросов с перемешиванием | Ограничение: 10 минут</p>
    </div>

    <div class="timer-box">
        <span>⏱️ Оставшееся время:</span>
        <span id="timer">10:00</span>
    </div>

    <form id="quizForm" style="margin-top: 20px;">
        <div id="questionsContainer"></div>
        <button type="button" class="btn-submit" onclick="finishQuiz(false)">Завершить тест</button>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
const TEST_TITLE = "ГРМ: Тест 1 (Базовый)";
let studentName = "";

const rawQuestions = [
    { q: "Каково основное назначение газораспределительного механизма (ГРМ) в ДВС?", options: ["Передача крутящего момента на ведущие колеса", "Своевременный впуск свежего заряда в цилиндры и выпуск отработавших газов", "Охлаждение деталей цилиндро-поршневой группы", "Подача масла под давлением к подшипникам"], correct: 1, exp: "ГРМ предназначен для управления процессами впуска горючей смеси/воздуха и выпуска продуктов сгорания." },
    { q: "Какой тип ГРМ наиболее распространен в современных четырехтактных автомобильных двигателях?", options: ["Клапанный", "Золотниковый", "Поршневой (с окнами в цилиндре)", "Мембранный"], correct: 0, exp: "Клапанные механизмы обеспечивают наилучшую герметичность камеры сгорания." },
    { q: "Какая деталь ГРМ непосредственно открывает и закрывает каналы в головке блока цилиндров (ГБЦ)?", options: ["Толкатель", "Клапан", "Штанга", "Коромысло"], correct: 1, exp: "Тарелка клапана перекрывает впускной или выпускной канал." },
    { q: "С какой частотой вращается распределительный вал относительно коленчатого вала в четырехтактном ДВС?", options: ["В 2 раза быстрее коленвала", "В 2 раза медленнее коленвала", "С той же частотой", "В 4 раза медленнее"], correct: 1, exp: "За 2 оборота коленвала рабочий цикл завершается, и распредвал делает ровно 1 оборот." },
    { q: "Чем отличается впускной клапан от выпускного по размеру тарелки?", options: ["Тарелка впускного клапана обычно больше по диаметру", "Тарелка выпускного клапана больше", "Размеры тарелок абсолютно одинаковы", "Впускной клапан вообще не имеет тарелки"], correct: 0, exp: "Увеличенный диаметр впускного клапана улучшает наполнение цилиндра свежим зарядом." },
    { q: "Из какого материала изготавливают тарелки выпускных клапанов?", options: ["Из жаропрочной (легированной) стали", "Из алюминиевого сплава", "Из серого чугуна", "Из меди"], correct: 0, exp: "Выпускные клапаны испытывают воздействие раскаленных отработавших газов." },
    { q: "Что возвращает клапан в закрытое состояние и прижимает его к седлу?", options: ["Давление газов в цилиндре", "Клапанная пружина", "Штанга толкателя", "Кулачок распредвала"], correct: 1, exp: "Пружина удерживает клапан закрытым, когда на него не давит кулачок." },
    { q: "Зачем на один клапан часто устанавливают две пружины с разным направлением навивки?", options: ["Для уменьшения массы", "Чтобы предотвратить опасный резонанс и удержать клапан при поломке одной пружины", "Для регулировки теплового зазора", "Чтобы клапан вращался медленнее"], correct: 1, exp: "Двойная пружина гасит вибрации и предотвращает падение клапана в цилиндр при поломке." },
    { q: "В чем заключается функция кулачков распределительного вала?", options: ["Нажимать на толкатели или рокеры для открытия клапанов в нужное время", "Смазывать детали ГРМ", "Охлаждать ГБЦ", "Уравновешивать коленвал"], correct: 0, exp: "Профиль кулачка задает момент, время и высоту открытия клапана." },
    { q: "Какая деталь передает усилие от кулачка распредвала к штанге при нижнем расположении распредвала (OHV)?", options: ["Толкатель", "Поршень", "Маховик", "Направляющая втулка"], correct: 0, exp: "Толкатель скользит по кулачку и передает движение на штангу." },
    { q: "Какую функцию выполняет штанга толкателя в схеме ГРМ с нижним распредвалом?", options: ["Передает движение от толкателя к коромыслу", "Открывает форсунку", "Охлаждает клапан", "Направляет движение поршня"], correct: 0, exp: "Штанга связывает нижний толкатель с верхним коромыслом." },
    { q: "Как называется двуплечий рычаг, передающий усилие от штанги на стержень клапана?", options: ["Коромысло (рокер)", "Шатун", "Кривошип", "Балансир"], correct: 0, exp: "Коромысло поворачивается на оси и меняет направление движения." },
    { q: "Какое соединение фиксирует тарелку пружины на стержне клапана?", options: ["Разрезные сухари", "Шпонка", "Резьбовая гайка", "Стопорное кольцо"], correct: 0, exp: "Сухари входят в конусное отверстие тарелки пружины и заклинивают ее на стержне." },
    { q: "Какая деталь предотвращает проникание масла из ГБЦ в камеру сгорания по стержню клапана?", options: ["Маслосъемный колпачок (сальник клапана)", "Компрессионное кольцо", "Прокладка ГБЦ", "Уплотнительная шайба"], correct: 0, exp: "Сальник клапана уплотняет зазор между стержнем и направляющей втулкой." },
    { q: "Куда запрессовываются направляющие втулки клапанов?", options: ["В головку блока цилиндров (ГБЦ)", "В блок цилиндров", "В поршень", "В поддон картера"], correct: 0, exp: "Втулки запрессованы в ГБЦ и задают точное направление движения клапанов." },
    { q: "Что такое фазы газораспределения?", options: ["Моменты начала открытия и конца закрытия клапанов, выраженные в углах поворота коленвала", "Частота вращения распредвала", "Величина теплового зазора", "Порядок работы цилиндров ДВС"], correct: 0, exp: "Фазы определяют интервалы времени, когда клапаны остаются открытыми." },
    { q: "Что понимают под «перекрытием клапанов»?", options: ["Состояние, когда и впускной, и выпускной клапаны одновременно приоткрыты", "Состояние, когда оба клапана плотно закрыты", "Поломку клапанного механизма", "Полное отсутствие теплового зазора"], correct: 0, exp: "Перекрытие клапанов происходит в конце такта выпуска и начале впуска для лучшей продувки." },
    { q: "Какой привод распредвала часто применяется на дизелях тракторов и грузовиков из-за высокой надежности?", options: ["Шестеренчатый", "Ременный", "Цепной", "Гидравлический"], correct: 0, exp: "Шестеренчатый привод передает жесткое вращение без риска обрыва или растяжения." },
    { q: "Зачем на шестерни/звездочки привода ГРМ наносят установочные метки?", options: ["Для правильной синхронизации фаз газораспределения при сборке", "Для контроля балансировки вала", "Для измерения уровня масла", "Для красоты"], correct: 0, exp: "Совмещение меток обеспечивает точное совпадение положений поршней и клапанов." },
    { q: "Какая часть клапана непосредственно прилегает к седлу при его закрытии?", options: ["Рабочая фаска тарелки клапана", "Торчащий конец стержня", "Выемка под сухари", "Средняя часть стержня"], correct: 0, exp: "Рабочая фаска тарелки клапана притирается к седлу для полной герметичности." }
];

function shuffle(array) {
    let cur = array.length, rIdx;
    while (cur !== 0) {
        rIdx = Math.floor(Math.random() * cur);
        cur--;
        [array[cur], array[rIdx]] = [array[rIdx], array[cur]];
    }
    return array;
}

const quizData = shuffle([...rawQuestions]);
let timeLeft = 600;
let timerInterval;

function startQuiz() {
    let input = document.getElementById("studentNameInput").value.trim();
    if (!input) {
        alert("Пожалуйста, введите свое ФИО!");
        return;
    }
    studentName = input;
    document.getElementById("authModal").style.display = "none";
    startTimer();
}

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        let min = Math.floor(timeLeft / 60);
        let sec = timeLeft % 60;
        document.getElementById('timer').innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            finishQuiz(true);
        }
    }, 1000);
}

function renderQuiz() {
    const container = document.getElementById('questionsContainer');
    quizData.forEach((item, index) => {
        let html = `<div class="question-card" id="card_${index}">
            <div class="question-text">${index + 1}. ${item.q}</div>`;
        item.options.forEach((opt, optIdx) => {
            html += `<label class="option" id="opt_${index}_${optIdx}">
                <input type="radio" name="q${index}" value="${optIdx}"> ${opt}
            </label>`;
        });
        html += `<div class="explanation" id="exp_${index}"><strong>Пояснение:</strong> ${item.exp}</div></div>`;
        container.innerHTML += html;
    });
}

function saveResultToAdmin(score, percent, markNum) {
    let logs = JSON.parse(localStorage.getItem("test_results_log") || "[]");
    let previousAttempts = logs.filter(item => item.userName === studentName && item.testTitle === TEST_TITLE).length;
    
    let now = new Date();
    let timeStr = now.toLocaleDateString('ru-RU') + " " + now.toLocaleTimeString('ru-RU').slice(0, 5);

    logs.push({
        userName: studentName,
        testTitle: TEST_TITLE,
        score: markNum,
        percent: percent,
        attempt: previousAttempts + 1,
        timestamp: timeStr
    });

    localStorage.setItem("test_results_log", JSON.stringify(logs));
}

function finishQuiz(isTimeout) {
    clearInterval(timerInterval);
    const inputs = document.querySelectorAll('input[type="radio"]');
    inputs.forEach(i => i.disabled = true);

    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';

    if (isTimeout) {
        resultBox.className = 'result-box status-failed';
        resultBox.innerHTML = `<h2>❌ ТЕСТ НЕ ПРОЙДЕН</h2><p>Ученик: <strong>${studentName}</strong></p><p><strong>Время (10 минут) истекло!</strong> Оценка: <strong>2 (Неудовлетворительно)</strong>.</p>`;
        saveResultToAdmin(0, 0, 2);
        return;
    }

    let score = 0;
    quizData.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const card = document.getElementById(`card_${index}`);
        const exp = document.getElementById(`exp_${index}`);
        exp.style.display = 'block';

        const correctOptEl = document.getElementById(`opt_${index}_${item.correct}`);
        if (correctOptEl) correctOptEl.classList.add('correct-option');

        if (selected) {
            const userAns = parseInt(selected.value);
            if (userAns === item.correct) {
                score++;
                card.classList.add('correct');
            } else {
                card.classList.add('wrong');
                const wrongOptEl = document.getElementById(`opt_${index}_${userAns}`);
                if (wrongOptEl) wrongOptEl.classList.add('wrong-option');
            }
        } else {
            card.classList.add('wrong');
        }
    });

    let percent = Math.round((score / quizData.length) * 100);
    let markText = "";
    let markNum = 2;
    let statusClass = "";

    if (score >= 18) { markText = "5 (Отлично)"; markNum = 10; statusClass = "status-passed"; }
    else if (score >= 15) { markText = "4 (Хорошо)"; markNum = 8; statusClass = "status-passed"; }
    else if (score >= 10) { markText = "3 (Удовлетворительно)"; markNum = 6; statusClass = "status-passed"; }
    else { markText = "2 (Неудовлетворительно)"; markNum = 2; statusClass = "status-failed"; }

    resultBox.className = `result-box ${statusClass}`;
    resultBox.innerHTML = `
        <h2>Результаты проверки</h2>
        <p>Ученик: <strong>${studentName}</strong></p>
        <p>Правильных ответов: <strong>${score} из ${quizData.length} (${percent}%)</strong></p>
        <p>Итоговая оценка: <strong>${markText}</strong></p>
        <hr><p>Правильные ответы подсвечены зеленым цветом, ошибочные — красным.</p>
    `;

    saveResultToAdmin(score, percent, markNum);
}

window.onload = function() {
    renderQuiz();
};
</script>
</body>
</html>
