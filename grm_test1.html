<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГРМ — Тест 1 (Базовый уровень)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; margin: 0; padding: 20px; }
        .quiz-card { max-width: 850px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .timer-sticky { position: sticky; top: 10px; background: #e74c3c; color: white; padding: 12px 20px; border-radius: 8px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 4px 10px rgba(231,76,60,0.3); }
        .question-block { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 5px solid #3498db; padding: 15px 20px; margin-bottom: 20px; border-radius: 6px; }
        .question-title { font-weight: 600; font-size: 16px; margin-bottom: 12px; }
        .option { display: block; margin: 8px 0; padding: 8px 12px; border-radius: 4px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; transition: background 0.2s; }
        .option:hover { background: #f1f5f9; }
        .option input { margin-right: 10px; }
        .btn-submit { display: block; width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #219150; }
        .result-box { margin-top: 25px; padding: 20px; border-radius: 8px; display: none; }
        .explanation { margin-top: 10px; padding: 10px; background: #e2e8f0; border-radius: 4px; font-size: 14px; color: #334155; display: none; }
        .failed { background: #fee2e2; border: 1px solid #f87171; color: #991b1b; }
        .passed { background: #dcfce7; border: 1px solid #4ade80; color: #166534; }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header">
        <h2>Газораспределительный механизм — Тест 1</h2>
        <p>Уровень: Базовый (Назначение, схемы и основные детали ГРМ)</p>
    </div>

    <div class="timer-sticky">
        <span>⏱️ Оставшееся время:</span>
        <span id="timer">10:00</span>
    </div>

    <form id="quizForm" style="margin-top: 20px;">
        <div id="questionsContainer"></div>
        <button type="button" class="btn-submit" onclick="finishQuiz(false)">Завершить тест</button>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
const rawData = [
    { q: "1. Каково основное назначение газораспределительного механизма (ГРМ)?", options: ["Для передачи вращения на колеса", "Для своевременного впуска свежего заряда в цилиндры и выпуска отработавших газов", "Для подачи масла к трущимся деталям", "Для охлаждения цилиндров"], correct: 1, exp: "ГРМ управляет процессами впуска рабочей смеси (или воздуха) и выпуска продуктов сгорания в строго определенные моменты." },
    { q: "2. Какой тип ГРМ наиболее распространен в современных ДВС тракторов и автомобилей?", options: ["Клапанный", "Золотниковый", "Поршневой", "Мембранный"], correct: 0, exp: "Клапанный механизм обеспечивает наилучшую герметичность и надежность работы системы." },
    { q: "3. Какая деталь ГРМ непосредственно открывает и закрывает впускные и выпускные каналы в ГБЦ?", options: ["Толкатель", "Клапан", "Штанга", "Коромысло"], correct: 1, exp: "Тарелка клапана садится на седло и перекрывает соответствующий канал в головке блока." },
    { q: "4. С какой частотой вращается распределительный вал относительно коленчатого вала в четырехтактном ДВС?", options: ["В 2 раза быстрее коленвала", "В 2 раза медленнее коленвала", "С той же скоростью", "В 4 раза медленнее"], correct: 1, exp: "За полный рабочий цикл четырехтактного ДВС (2 оборота коленвала) распределительный вал делает ровно 1 оборот." },
    { q: "5. Чем отличается впускной клапан от выпускного по размеру тарелки?", options: ["Тарелка впускного клапана обычно больше по диаметру", "Тарелка выпускного клапана больше", "Они одинаковы", "Впускной клапан не имеет тарелки"], correct: 0, exp: "Тарелка впускного клапана имеет больший диаметр для лучшего наполнения цилиндра свежим зарядом." },
    { q: "6. Из какого материала изготавливают тарелки выпускных клапанов?", options: ["Из жаропрочной стали", "Из алюминиевого сплава", "Из серого чугуна", "Из меди"], correct: 0, exp: "Выпускные клапаны омываются раскаленными отработавшими газами и требуют высоких жаростойких свойств." },
    { q: "7. Что обеспечивает плотное прижатие клапана к седлу в закрытом состоянии?", options: ["Давление газов", "Клапанная пружина", "Штанга", "Толкатель"], correct: 1, exp: "Пружина удерживает клапан в закрытом положении, предотвращая утечку газов." },
    { q: "8. Для чего на клапане устанавливают пружины с противоположным направлением навивки (две пружины на клапан)?", options: ["Для красоты", "Чтобы избежать резонанса и предотвратить падение клапана в цилиндр при поломке одной из пружин", "Чтобы уменьшить массу клапана", "Для регулировки зазора"], correct: 1, exp: "Двойная пружина предотвращает опасный резонанс и фиксирует клапан при повреждении одной пружины." },
    { q: "9. В чем заключается функция кулачков распределительного вала?", options: ["Смазывать вал", "Нажимать на толкатели или рокеры для своевременного открытия клапанов", "Уравновешивать вал", "Удерживать маховик"], correct: 1, exp: "Профиль кулачка определяет момент, высоту и продолжительность открытия клапана." },
    { q: "10. Какая деталь ГРМ передает усилие от кулачка распредвала к штанге при нижнем расположении распредвала?", options: ["Толкатель", "Поршень", "Маховик", "Направляющая втулка"], correct: 0, exp: "Толкатель воспринимает боковое усилие кулачка и передает вертикальное перемещение на штангу." },
    { q: "11. Какую функцию выполняет штанга толкателя?", options: ["Открывает форсунку", "Передает движение от толкателя к коромыслу", "Охлаждает клапан", "Направляет движение поршня"], correct: 1, exp: "Штанга применяется при нижней установке распределительного вала для передачи движения на коромысло." },
    { q: "12. Как называется двуплечий рычаг, передающий усилие от штанги на стержень клапана?", options: ["Коромысло (рокер)", "Шатун", "Кривошип", "Балансир"], correct: 0, exp: "Коромысло поворачивается на оси и изменяет направление движения штанги вниз на клапан." },
    { q: "13. Какое сопряжение фиксирует пружину на стержне клапана?", options: ["Шпонка", "Замочные сухари и тарелка пружины", "Резьбовая гайка", "Стопорное кольцо"], correct: 1, exp: "Разрезные сухари входят в проточку стержня клапана и удерживают тарелку пружины." },
    { q: "14. Какая деталь предотвращает проникание масла из ГБЦ по стержню клапана в камеру сгорания?", options: ["Маслосъемный колпачок (сальник клапана)", "Компрессионное кольцо", "Прокладка ГБЦ", "Уплотнительная шайба"], correct: 0, exp: "Маслоотражательные колпачки надеваются на направляющую втулку стержня клапана." },
    { q: "15. Куда запрессовываются направляющие втулки клапанов?", options: ["В блок цилиндров", "В головку блока цилиндров (ГБЦ)", "В поршень", "В поддон"], correct: 1, exp: "Направляющие втулки обеспечивают точное вертикальное перемещение клапанов в ГБЦ." },
    { q: "16. Что такое фазы газораспределения?", options: ["Моменты открытия и закрытия клапанов, выраженные в углах поворота коленчатого вала", "Скорость вращения распредвала", "Зазор в клапанном механизме", "Порядок работы цилиндров"], correct: 0, exp: "Фазы газораспределения показывают углы поворота коленвала, при которых клапаны открываются и закрываются." },
    { q: "17. Что такое «перекрытие клапанов»?", options: ["Состояние, когда оба клапана (впускной и выпускной) одновременно открыты", "Состояние, когда оба клапана закрыты", "Поломка клапана", "Полный износ пружин"], correct: 0, exp: "Перекрытие клапанов происходит в районе ВМТ на стыке тактов выпуска и впуска для улучшения продувки." },
    { q: "18. Какой привод распредвала чаще всего используется в дизелях тракторов (например, Д-240)?", options: ["Шестеренчатый", "Цепной", "Ременный", "Гидравлический"], correct: 0, exp: "Шестеренчатый привод от коленвала обеспечивает максимальную надежность и долговечность в тяжелых условиях." },
    { q: "19. Зачем на шестернях привода ГРМ наносят установочные метки?", options: ["Для контроля веса", "Для правильной установки фаз газораспределения при сборке", "Для регулировки давления масла", "Для красоты"], correct: 1, exp: "Совмещение меток гарантирует согласованное вращение коленчатого и распределительного валов." },
    { q: "20. Какая деталь ГРМ непосредственно опирается на седло?", options: ["Тарелка клапана", "Кулачок распредвала", "Стержень клапана", "Толкатель"], correct: 0, exp: "Рабочая фаска тарелки клапана плотно прилегает к рабочей поверхности седла." }
];

function shuffle(array) {
    let cur = array.length, rIndex;
    while (cur !== 0) {
        rIndex = Math.floor(Math.random() * cur);
        cur--;
        [array[cur], array[rIndex]] = [array[rIndex], array[cur]];
    }
    return array;
}

const quizData = shuffle([...rawData]);

let timeLeft = 600;
let timerInterval;

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        let min = Math.floor(timeLeft / 60);
        let sec = timeLeft % 60;
        document.getElementById('timer').innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            finishQuiz(true);
        }
    }, 1000);
}

function renderQuiz() {
    const container = document.getElementById('questionsContainer');
    quizData.forEach((item, index) => {
        let html = `<div class="question-block">
            <div class="question-title">${index + 1}. ${item.q}</div>`;
        item.options.forEach((opt, optIdx) => {
            html += `<label class="option">
                <input type="radio" name="q${index}" value="${optIdx}"> ${opt}
            </label>`;
        });
        html += `<div class="explanation" id="exp_${index}"><strong>Пояснение:</strong> ${item.exp}</div></div>`;
        container.innerHTML += html;
    });
}

function finishQuiz(isTimeout) {
    clearInterval(timerInterval);
    const inputs = document.querySelectorAll('input[type="radio"]');
    inputs.forEach(i => i.disabled = true);

    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';

    quizData.forEach((_, index) => {
        document.getElementById(`exp_${index}`).style.display = 'block';
    });

    if (isTimeout) {
        resultBox.className = 'result-box failed';
        resultBox.innerHTML = `
            <h2>❌ ТЕСТ НЕ ПРОЙДЕН</h2>
            <p><strong>Причина:</strong> Время отведенное на тест (10 минут) истекло!</p>
            <p>Итоговая оценка: <strong>2 (Неудовлетворительно)</strong></p>
            <p>Ознакомьтесь с правильными ответами и пояснениями ниже.</p>
        `;
        return;
    }

    let score = 0;
    quizData.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if (selected && parseInt(selected.value) === item.correct) {
            score++;
        }
    });

    let mark = "";
    let statusClass = "";

    if (score >= 18) { mark = "5 (Отлично)"; statusClass = "passed"; }
    else if (score >= 15) { mark = "4 (Хорошо)"; statusClass = "passed"; }
    else if (score >= 10) { mark = "3 (Удовлетворительно)"; statusClass = "passed"; }
    else { mark = "2 (Неудовлетворительно)"; statusClass = "failed"; }

    resultBox.className = `result-box ${statusClass}`;
    resultBox.innerHTML = `
        <h2>Результаты тестирования</h2>
        <p>Правильных ответов: <strong>${score} из ${quizData.length}</strong></p>
        <p>Итоговая оценка: <strong>${mark}</strong></p>
        <hr>
        <p>Ниже представлены правильные ответы и пояснения к каждому вопросу.</p>
    `;
}

window.onload = function() {
    renderQuiz();
    startTimer();
};
</script>
</body>
</html>
