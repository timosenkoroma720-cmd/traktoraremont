<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест 3: Повышенный уровень — Система смазки двигателя</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #9b59b6; padding-bottom: 10px; }
        .timer { font-size: 20px; font-weight: bold; color: #e74c3c; background: #ffe6e6; padding: 5px 15px; border-radius: 5px; }
        .q-card { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background: #fafafa; }
        .q-title { font-weight: bold; margin-bottom: 10px; }
        .option { display: block; margin: 5px 0; cursor: pointer; }
        button { background-color: #9b59b6; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #8e44ad; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 5px; text-align: center; font-size: 20px; font-weight: bold; }
        .pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .timeout-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,0,0,0.9); justify-content: center; align-items: center; color: white; font-size: 36px; font-weight: bold; text-align: center; z-index: 1000; padding: 20px; box-sizing: border-box; }
        .explanation { margin-top: 8px; font-size: 14px; padding: 8px; border-radius: 4px; }
        .exp-correct { background-color: #d4edda; color: #155724; }
        .exp-incorrect { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div id="timeoutAlert" class="timeout-overlay">
    ТЕСТ НЕ ПРОЙДЕН, ОБРАТИТЕСЬ К УЧИТЕЛЮ
</div>

<div class="container">
    <div class="header">
        <h2>Тест 3: Повышенный уровень (Спецсистемы и диагностика)</h2>
        <div class="timer" id="timer">10:00</div>
    </div>
    <form id="quizForm" style="margin-top: 20px;">
        <div id="questionsContainer"></div>
        <button type="button" onclick="submitQuiz()">Завершить тест</button>
    </form>
    <div id="result" class="result-box" style="display:none;"></div>
</div>

<script>
const rawQuestions = [
    { q: "В чем главное преимущество системы смазки с «сухим картером» (Dry Sump)?", options: ["Исключение масляного голодания при высоких боковых перегрузках и уменьшение высоты ДВС", "Удешевление конструкции двигателя", "Полный отказ от использования масляного фильтра", "Отсутствие необходимости менять масло"], correct: 0, exp: "Сухой картер использует откачивающие насосы и отдельный бак, предотвращая отлив масла в поворотах." },
    { q: "Какую функцию выполняет масляная форсунка (форсунка охлаждения поршня)?", options: ["Охлаждает днище поршня путем непрерывного разбрызгивания масла", "Впрыскивает масло в камеру сгорания для уплотнения", "Очищает стенки цилиндра от нагара высоким давлением", "Смазывает свечи зажигания"], correct: 0, exp: "Форсунки струей масла снижают температуру днища поршня в высоконагруженных и турбированных ДВС." },
    { q: "Что такое гидродинамическое трение (жидкостное) в подшипниках коленчатого вала?", options: ["Режим, при котором поверхности вала и вкладыша полностью разделены слоем масла под давлением", "Прямой контакт металл-по-металлу", "Смазка деталей исключительно водой", "Трение с участием сухого графита"], correct: 0, exp: "При жидкостном трении износ деталей отсутствует, так как они разделены масляным клином." },
    { q: "Каковы последствия зависания редукционного клапана в ОТКРЫТОМ положении?", options: ["Падение давления масла в главной магистрали на всех режимах", "Чрезмерный рост давления и разрыв масляного фильтра", "Перегрев масляного радиатора", "Попадание масла в систему охлаждения"], correct: 0, exp: "Открытый клапан постоянно сбрасывает масло в поддон, снижая рабочее давление." },
    { q: "Каковы последствия зависания редукционного клапана в ЗАКРЫТОМ положении?", options: ["Аварийный рост давления при высоких оборотах, опасность повреждения фильтра и уплотнений", "Падение давления до нуля", "Перелив масла в цилиндры", "Прекращение подачи топлива"], correct: 0, exp: "Невозможность сброса избыточного давления приведет к выбиванию сальников или повреждению фильтра." },
    { q: "Как влияет разжижение масла топливом (при неисправности форсунок) на работу ДВС?", options: ["Падает вязкость и прочность масляной пленки, ускоряется износ", "Увеличивается вязкость и давление", "Улучшаются моющие свойства", "Никак не влияет"], correct: 0, exp: "Топливо разжижает масло, что приводит к разрушению масляного клина и задирам деталей." },
    { q: "Для чего применяются регулируемые (переменной производительности) масляные насосы?", options: ["Для снижения механических потерь ДВС за счет оптимальной прокачки масла", "Для увеличения объема поддона", "Для возможности работы без масла", "Для автоматической замены фильтра"], correct: 0, exp: "Насосы с переменным вытеснением изменяют производительность в зависимости от нагрузки, экономя топливо." },
    { q: "Что характеризует щелочное число (TBN) моторного масла?", options: ["Способность нейтрализовать кислоты, образующиеся при сгорании топлива", "Температуру вспышки масла в открытом тигле", "Процентное содержание синтетических полимеров", "Уровень пенообразования"], correct: 0, exp: "TBN показывает запас моюще-нейтрализующих присадок для борьбы с окислением." },
    { q: "Что происходит с маслом при высокой зольности (High SAPS) в двигателях с сажевыми фильтрами (DPF)?", options: ["Продукты сгорания присадок быстро забивают сажевый фильтр", "Увеличивается мощность двигателя", "Сажевый фильтр самоочищается", "Уменьшается расход масла"], correct: 0, exp: "Для моторов с DPF/GPF требуются малозольные масла (Low/Mid SAPS), иначе фильтр выйдет из строя." },
    { q: "Каким прибором производится точное механическое измерение давления в системе смазки?", options: ["Манометром, подключаемым вместо датчика давления", "Мультиметром", "Компрессометром", "Динамометром"], correct: 0, exp: "Контрольный манометр вворачивается в масляную магистраль для проверки физического давления." },
    { q: "Что из перечисленного приводит к образованию низкотемпературного шлама в двигателе?", options: ["Частые короткие поездки на непрогретом ДВС и частая работа на холостом ходу", "Длительное движение по трассе со скоростью 100 км/ч", "Использование масел High SAPS", "Замена масла каждые 5000 км"], correct: 0, exp: "Конденсат воды и несгоревшее топливо при частых коротких поездках образуют эмульсию и шлам." },
    { q: "В чем разница между допусками масел API и ACEA?", options: ["API — американский стандарт, ACEA — европейский с более строгими требованиями к стойкости", "API — для дизелей, ACEA — только для бензиновых", "API определяет вязкость, ACEA — объем заправки", "Это одинаковые стандарты разных лет"], correct: 0, exp: "Европейские стандарты ACEA учитывают специфику высоконагруженных европейских моторов." },
    { q: "Какую функцию выполняет клапан PCV в системе вентиляции картера?", options: ["Регулирует объем отвода картерных газов в зависимости от разряжения во впускном коллекторе", "Блокирует масляный фильтр", "Сливает конденсат из выхлопной трубы", "Нагнетает свежий воздух в поддон"], correct: 0, exp: "Клапан PCV дозирует отвод газов, предотвращая нарушение смесеобразования и рост давления в картере." },
    { q: "Какое явление называется «кавитацией» в масляном насосе?", options: ["Образование и схлопывание пузырьков пара/газа в масле, разрушающее детали насоса", "Замерзание масла при низкой температуре", "Вспенивание масла в поддоне коленвалом", "Попадание стружки в насос"], correct: 0, exp: "Кавитация возникать при высоком сопротивлении на всасывании и разрушает шестерни насоса." },
    { q: "К чему приводит засорение масляных каналов в головке блока цилиндров (ГБЦ)?", options: ["К масляному голоданию распредвалов и гидрокомпенсаторов, задирам постелей", "К перегреву масляного поддона", "К росту давления в районе масляного фильтра", "К выходу из строя стартера"], correct: 0, exp: "Верхняя часть двигателя (ГБЦ) страдает от недостатка смазки в первую очередь." },
    { q: "Что такое «тест капельной пробы» моторного масла?", options: ["Метод экспресс-оценки степени загрязнения и браковочных показателей масла по пятну на бумаге", "Проверка масла на горючесть", "Измерение объема масла в цилиндре", "Определение плотности ареометром"], correct: 0, exp: "Капля масла на фильтровальной бумаге показывает наличие шлама, воды и остаточный ресурс присадок." },
    { q: "Как влияет неисправность противодренажного клапана фильтра на работу ДВС?", options: ["Появление стука гидрокомпенсаторов/фазовращателей при запуске из-за задержки давления", "Постоянное горение лампы давления на всех оборотах", "Утечка масла наружу под капот", "Снижение температуры двигателя"], correct: 0, exp: "Без клапана магистраль пустеет за время стоянки, и первые секунды пуска двигатель работает всухую." },
    { q: "Что происходит при превышении индекса Shear Stability (shift resistance) в масле?", options: ["Полимерный загуститель разрушается, масло безвозвратно теряет вязкость", "Масло превращается в густой гудрон", "Масло разъедает прокладки", "Забивается масляный радиатор"], correct: 0, exp: "Низкая стойкость к сдвигу приводит к быстрому падению вязкости масла в процессе эксплуатации." },
    { q: "За счет чего фазовращатели (система VVT/VANOS) изменяют положение распредвала?", options: ["За счет гидравлического давления моторного масла, подаваемого через электромагнитный клапан", "За счет механических пружин", "За счет отдельного электродвигателя", "За счет давления выхлопных газов"], correct: 0, exp: "Управление фазами газораспределения напрямую зависит от стабильности давления и чистоты моторного масла." },
    { q: "Почему в дизельных ДВС масло темнеет значительно быстрее, чем в бензиновых?", options: ["Из-за высокого образования сажи при сгорании дизельного топлива", "Из-за более высокой температуры в поддоне", "Из-за взаимодействия с дизельным фильтром", "Дизельное масло изначально черное"], correct: 0, exp: "Сажа — естественный продукт сгорания солярки, диспергирующие присадки удерживают ее в масле." }
];

let shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let questions = shuffle([...rawQuestions]).map(q => {
    let opts = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.correct }));
    opts = shuffle(opts);
    return { ...q, options: opts };
});

function renderQuiz() {
    const container = document.getElementById("questionsContainer");
    questions.forEach((q, idx) => {
        let qDiv = document.createElement("div");
        qDiv.className = "q-card";
        let html = `<div class="q-title">Вопрос ${idx + 1}: ${q.q}</div>`;
        q.options.forEach((opt, oIdx) => {
            html += `<label class="option"><input type="radio" name="q${idx}" value="${oIdx}"> ${opt.text}</label>`;
        });
        html += `<div id="exp${idx}" class="explanation" style="display:none;"></div>`;
        qDiv.innerHTML = html;
        container.appendChild(qDiv);
    });
}

let timeLeft = 600;
let timerElem = document.getElementById("timer");
let timerId = setInterval(() => {
    timeLeft--;
    let m = Math.floor(timeLeft / 60);
    let s = timeLeft % 60;
    timerElem.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    if (timeLeft <= 0) {
        clearInterval(timerId);
        document.getElementById("timeoutAlert").style.display = "flex";
    }
}, 1000);

function submitQuiz() {
    clearInterval(timerId);
    let score = 0;
    questions.forEach((q, idx) => {
        let selected = document.querySelector(`input[name="q${idx}"]:checked`);
        let expDiv = document.getElementById(`exp${idx}`);
        expDiv.style.display = "block";
        
        let correctOpt = q.options.findIndex(o => o.isCorrect);
        if (selected && q.options[parseInt(selected.value)].isCorrect) {
            score++;
            expDiv.className = "explanation exp-correct";
            expDiv.innerHTML = `<b>Верно!</b> ${q.exp}`;
        } else {
            expDiv.className = "explanation exp-incorrect";
            expDiv.innerHTML = `<b>Неверно.</b> Правильный ответ: ${q.options[correctOpt].text}.<br>${q.exp}`;
        }
    });

    let percent = (score / 20) * 100;
    let mark = 1;
    if (percent >= 96) mark = 10;
    else if (percent >= 90) mark = 9;
    else if (percent >= 80) mark = 8;
    else if (percent >= 70) mark = 7;
    else if (percent >= 60) mark = 6;
    else if (percent >= 50) mark = 5;
    else if (percent >= 40) mark = 4;
    else if (percent >= 30) mark = 3;
    else if (percent >= 15) mark = 2;
    else mark = 1;

    let resBox = document.getElementById("result");
    resBox.style.display = "block";
    if (mark >= 3) {
        resBox.className = "result-box pass";
        resBox.innerHTML = `Тест пройден! Верных ответов: ${score} из 20 (${percent}%).<br>Ваша оценка: ${mark} баллов.`;
    } else {
        resBox.className = "result-box fail";
        resBox.innerHTML = `Тест не пройден (порог 3 балла не достигнут). Верных ответов: ${score} из 20.<br>Ваша оценка: ${mark} баллов.`;
    }
    window.scrollTo(0, document.body.scrollHeight);
}

renderQuiz();
</script>
</body>
</html>
