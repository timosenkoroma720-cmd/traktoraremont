<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КШМ — Тест 3 (Сложный)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; margin: 0; padding: 20px; }
        .quiz-card { max-width: 850px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .timer-sticky { position: sticky; top: 10px; background: #e74c3c; color: white; padding: 12px 20px; border-radius: 8px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 4px 10px rgba(231,76,60,0.3); }
        .question-block { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 5px solid #c0392b; padding: 15px 20px; margin-bottom: 20px; border-radius: 6px; }
        .question-title { font-weight: 600; font-size: 16px; margin-bottom: 12px; }
        .option { display: block; margin: 8px 0; padding: 8px 12px; border-radius: 4px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; transition: background 0.2s; }
        .option:hover { background: #f1f5f9; }
        .option input { margin-right: 10px; }
        .btn-submit { display: block; width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #219150; }
        .result-box { margin-top: 25px; padding: 20px; border-radius: 8px; display: none; }
        .explanation { margin-top: 10px; padding: 10px; background: #e2e8f0; border-radius: 4px; font-size: 14px; color: #334155; display: none; }
        .failed { background: #fee2e2; border: 1px solid #f87171; color: #991b1b; }
        .passed { background: #dcfce7; border: 1px solid #4ade80; color: #166534; }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header">
        <h2>Кривошипно-шатунный механизм — Тест 3</h2>
        <p>Уровень: Сложный (Диагностика, износ, техническое обслуживание и затяжка ГБЦ)</p>
    </div>

    <div class="timer-sticky">
        <span>⏱️ Оставшееся время:</span>
        <span id="timer">10:00</span>
    </div>

    <form id="quizForm" style="margin-top: 20px;">
        <div id="questionsContainer"></div>
        <button type="button" class="btn-submit" onclick="finishQuiz(false)">Завершить тест</button>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
const quizData = [
    { q: "1. В какой части гильзы цилиндра наблюдается наибольший естественный износ по диаметру?", options: ["В средней части", "В верхней части (в зоне останова первого компрессионного кольца при ВМТ)", "В самой нижней части", "Износ всегда абсолютно равномерный"], correct: 1, exp: "В зоне ВМТ действует максимальная температура, высокое давление газов и ухудшены условия смазки." },
    { q: "2. Какую форму приобретает внутреннее отверстие гильзы цилиндра в результате длительного износа по длине?", options: ["Сферическую", "Конусную (бочкообразную)", "Овально-конусную", "Пирамидальную"], correct: 2, exp: "Из-за действия боковых сил и неравномерного давления гильза становится овальной по сечению и конусной по высоте." },
    { q: "3. Какой из признаков указывает на предельный износ поршневых колец и гильз цилиндров?", options: ["Падение давления в системе смазки", "Повышенный прорыв газов в картер и падение компрессии в цилиндрах", "Стук в генераторе", "Перегрев топливного насоса"], correct: 1, exp: "Потеря герметичности приводит к прорыву газов в картер и затрудненному пуску дизеля из-за низкой компрессии." },
    { q: "4. Какой инструмент используется для точного измерения внутреннего диаметра гильзы цилиндра на разной глубине?", options: ["Штангенциркуль", "Нутромер микрометрический или индикаторный", "Микрометр гладкий", "Металлическая линейка"], correct: 1, exp: "Индикаторный нутромер позволяет измерить износ (овальность и конусность) внутри цилиндра." },
    { q: "5. В каком порядке следует затягивать гайки (болты) крепления головки блока цилиндров (ГБЦ)?", options: ["Произвольно", "От краев к центру", "От центра к краям по спирали или крест-накрест", "По часовой стрелке по кругу"], correct: 2, exp: "Затяжка от центра к краям предотвращает коробление ГБЦ и обеспечивает равномерное обжатие прокладки." },
    { q: "6. Какой инструмент обязательно применяется для затяжки гаек ГБЦ и шатунных болтов с нормированным усилием?", options: ["Рожковый ключ", "Динамометрический ключ", "Пневматический гайковерт без регулировки", "Молоток и зубило"], correct: 1, exp: "Динамометрический ключ контролирует точность момента затяжки резьбовых соединений." },
    { q: "7. К чему приводит слишком слабая затяжка болтов ГБЦ?", options: ["К поломке коленчатого вала", "К прогару прокладки ГБЦ и утечке охлаждающей жидкости или газов", "К заклиниванию поршня", "К выпаданию гильзы"], correct: 1, exp: "Недостаточный момент приводит к прорыву газов и разрушению прокладки." },
    { q: "8. Какой стук прослушивается при увеличении зазора между шатунной шейкой и вкладышем?", options: ["Глухой, низкого тона стук в нижней части блока", "Звонкий металлический стук высокого тона", "Стук средней частоты и тональности, усиливающийся при резком увеличении подачи топлива", "Шуршащий звук"], correct: 2, exp: "Шатунные подшипники стучат со средним тоном, звук резко усиливается при подгазовке." },
    { q: "9. Какой стук характеризует предельный износ коренных подшипников коленчатого вала?", options: ["Звонский стук в верхней части ГБЦ", "Глухой тяжелый стук высокого тона при работе под нагрузкой в нижней части блока", "Лязг маховика", "Свист"], correct: 1, exp: "Коренные подшипники дают глухой, сильный и низкий стук в районе поддона." },
    { q: "10. Какая неисправность КШМ может вызывать появление сизого (голубоватого) дыма из выхлопной трубы?", options: ["Износ или залегание (закоксовывание) маслосъемных колец", "Попадание воды в топливо", "Недогрев дизеля", "Поломка генератора"], correct: 0, exp: "При залегании маслосъемных колец масло попадает в камеру сгорания, окрашивая выхлоп в сизый цвет." },
    { q: "11. Что такое «залегание» (закоксовывание) поршневых колец?", options: ["Поломка кольца на части", "Потеря упругости и подвижности колец в канавках поршня из-за нагара и смолистых отложений", "Выпадание кольца в поддон", "Износ замка"], correct: 1, exp: "Закоксовывание происходит при сгорании масла и образовании нагара, зажимающего кольцо." },
    { q: "12. Как называют явление, при котором поршень при перекладке в ВМТ ударяет юбкой о стенку изношенной гильзы?", options: ["Детонация", "Стук поршня (перекладка поршня)", "Гидроудар", "Кавитация"], correct: 1, exp: "Увеличенный зазор между юбкой и гильзой вызывает глухой щелкающий стук при перекладке." },
    { q: "13. Какова основная опасность «гидроудара» в цилиндре двигателя?", options: ["Загрязнение масла", "Изгиб или поломка шатуна, разрушение поршня и ГБЦ", "Разрядка аккумулятора", "Поломка глушителя"], correct: 1, exp: "Жидкость (вода или несжимаемый антифриз) в цилиндре не сжимается, что ломает КШМ при подъеме поршня." },
    { q: "14. Каким прибором можно проверить компрессию в цилиндрах дизельного двигателя?", options: ["Компрессометром (или компрессографом)", "Манометром масляным", "Ареометром", "Вольтметром"], correct: 0, exp: "Компрессометр замеряет максимальное давление воздуха, создаваемое поршнем на такте сжатия." },
    { q: "15. Почему затяжку ГБЦ на двигателях с чугунным блоком проверяют повторно после прогрева и работы двигателя?", options: ["Болты сами откручиваются", "Из-за температурной усадки прокладки ГБЦ и вытягивания резьбы", "Это требование техники безопасности", "Для смазки болтов"], correct: 1, exp: "После тепловой обкатки прокладка дает усадку и требует окончательной подтяжки." },
    { q: "16. Какова главная причина задира поршня на поверхности гильзы цилиндра?", options: ["Перегрев двигателя и отсутствие смазки (сухое трение)", "Низкое давление воздуха", "Засор воздушного фильтра", "Слишком густое масло в КПП"], correct: 0, exp: "Перегрев вызывает расширение поршня свыше зазора, разрушая масляную пленку и вызывая задир металла." },
    { q: "17. Что следует сделать со шлифованными шеками коленчатого вала после проведения ремонтной шлифовки под ремонтный размер?", options: ["Покрыть краской", "Промыть и очистить грязеуловительные каналы (полости)", "Заварить полости", "Закалить в воде"], correct: 1, exp: "Промывка полостей гарантирует отсутствие абразивной стружки, способной сразу испортить новые вкладыши." },
    { q: "18. Как изменится компрессия в цилиндре, если через форсуночное отверстие налить 15–20 см³ моторного масла (при неисправных кольцах)?", options: ["Упадет до нуля", "Заметно возрастет", "Не изменится", "Двигатель заклинит"], correct: 1, exp: "Масло временно уплотняет зазоры в кольцах; если компрессия выросла — изношены кольца, а не клапаны." },
    { q: "19. Из-за чего на днище поршня и стенках камеры сгорания образуется плотный слой нагара?", options: ["Из-за длительной работы дизеля на холостом ходу и работы на некачественном/сгорающем масле", "Из-за езды на высокой скорости", "Из-за высокого давления в шинах", "Из-за частой промывки"], correct: 0, exp: "Неполное сгорание топлива и попадание масла образуют смолистые нагаровые отложения." },
    { q: "20. Что из перечисленного входит в ТО-2 по кривошипно-шатунному механизму?", options: ["Полная разборка ДВС", "Проверка состояния и крепления двигателя, подтяжка болтов ГБЦ и поддона, проверка на отсутствие утечек", "Шлифовка вала", "Замена поршней"], correct: 1, exp: "При ТО-2 проводят контрольно-диагностические и крепежные работы без полной разборки агрегата." }
];

let timeLeft = 600;
let timerInterval;

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        let min = Math.floor(timeLeft / 60);
        let sec = timeLeft % 60;
        document.getElementById('timer').innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            finishQuiz(true);
        }
    }, 1000);
}

function renderQuiz() {
    const container = document.getElementById('questionsContainer');
    quizData.forEach((item, index) => {
        let html = `<div class="question-block">
            <div class="question-title">${item.q}</div>`;
        item.options.forEach((opt, optIdx) => {
            html += `<label class="option">
                <input type="radio" name="q${index}" value="${optIdx}"> ${opt}
            </label>`;
        });
        html += `<div class="explanation" id="exp_${index}"><strong>Пояснение:</strong> ${item.exp}</div></div>`;
        container.innerHTML += html;
    });
}

function finishQuiz(isTimeout) {
    clearInterval(timerInterval);
    const inputs = document.querySelectorAll('input[type="radio"]');
    inputs.forEach(i => i.disabled = true);

    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';

    quizData.forEach((_, index) => {
        document.getElementById(`exp_${index}`).style.display = 'block';
    });

    if (isTimeout) {
        resultBox.className = 'result-box failed';
        resultBox.innerHTML = `
            <h2>❌ ТЕСТ НЕ ПРОЙДЕН</h2>
            <p><strong>Причина:</strong> Время отведенное на тест (10 минут) истекло!</p>
            <p>Итоговая оценка: <strong>2 (Неудовлетворительно)</strong></p>
            <p>Ознакомьтесь с правильными ответами ниже.</p>
        `;
        return;
    }

    let score = 0;
    quizData.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if (selected && parseInt(selected.value) === item.correct) {
            score++;
        }
    });

    let mark = "";
    let statusClass = "";

    if (score >= 18) { mark = "5 (Отлично)"; statusClass = "passed"; }
    else if (score >= 15) { mark = "4 (Хорошо)"; statusClass = "passed"; }
    else if (score >= 10) { mark = "3 (Удовлетворительно)"; statusClass = "passed"; }
    else { mark = "2 (Неудовлетворительно)"; statusClass = "failed"; }

    resultBox.className = `result-box ${statusClass}`;
    resultBox.innerHTML = `
        <h2>Результаты тестирования</h2>
        <p>Правильных ответов: <strong>${score} из ${quizData.length}</strong></p>
        <p>Итоговая оценка: <strong>${mark}</strong></p>
        <hr>
        <p>Ниже представлены правильные ответы и пояснения к каждому вопросу.</p>
    `;
}

window.onload = function() {
    renderQuiz();
    startTimer();
};
</script>
</body>
</html>
